<script>
// Thay google.script.run: gọi server Master Listing (POST JSON, token trong header Authorization; không dùng cookie)
(function () {
  const API = 'https://listing-api.xfilter.com.vn';
  window.ML_API = API;   // ảnh listing: link ký do server trả là đường dẫn tương đối (Note 37)
  const RIENG = { trangThaiMatKhau: a => ['/api/trang-thai', {}, ''],
    taoTaiKhoanDau: a => ['/api/tao-tai-khoan-dau', { ten: a[0], mat_khau: a[1], ma: a[2] }, ''],
    login: a => ['/api/dang-nhap', { ten: a[0], mat_khau: a[1] }, ''],
    logout: a => ['/api/dang-xuat', {}, a[0]],
    doiMatKhau: a => ['/api/doi-mat-khau', { cu: a[1], moi: a[2] }, a[0]] };
  function goi(fn, args) {
    const [path, body, token] = RIENG[fn] ? RIENG[fn](args) : ['/api', { fn, args }, args[0]];
    const h = { 'Content-Type': 'application/json' };
    if (token) h.Authorization = 'Bearer ' + token;
    return fetch(API + path, { method: 'POST', credentials: 'omit', headers: h, body: JSON.stringify(body) })
      .then(r => { if (!r.ok) throw new Error('Máy chủ trả lỗi ' + r.status); return r.json(); });
  }
  function mk(ok, bad) {
    return new Proxy({}, { get(_, fn) {
      if (fn === 'withSuccessHandler') return f => mk(f, bad);
      if (fn === 'withFailureHandler') return f => mk(ok, f);
      return (...args) => goi(fn, args).then(j => j.ok ? ok && ok(j.res) : bad && bad(new Error(j.err)),
        e => bad && bad(new Error('Không kết nối được máy chủ Master Listing (' + e.message + '). Máy Mac mini có đang bật không?')));
    } });
  }
  window.google = { script: { run: mk() } };
})();
</script>

<script>
/* ============ Tiện ích ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim();
const flat = s => norm(s).replace(/[\s\-_.\/]/g, '');
const fmt = n => Number(n || 0).toLocaleString('vi-VN');
const num = s => Number(String(s == null ? '' : s).replace(/[^\d\-]/g, '')) || 0;
// Giá (anh Trung 05/10/2026, sửa lỗi 450.000 → 450 / NaN): nhận số hoặc chuỗi nghìn "1.068.000"; trống/sai → null, hiện "—" chứ không hiện 0
const docGia = v => {
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v) : null;
  const s = String(v == null ? '' : v).trim().replace(/\s*(₫|đ|vnd)$/i, '');
  if (/^\d+$/.test(s) || /^\d{1,3}([.,]\d{3})+$/.test(s)) return Number(s.replace(/[.,]/g, ''));
  return null;
};
const gia = v => { const n = docGia(v); return n == null ? '—' : n.toLocaleString('vi-VN') + ' ₫'; };
const khoangGia = (a, b) => {
  const x = docGia(a), y = docGia(b);
  if (x == null && y == null) return '—';
  if (x == null || y == null || x === y) return gia(x == null ? y : x);
  return x.toLocaleString('vi-VN') + '–' + gia(y);
};
// Ảnh listing (Note 37): link ảnh do server ký, gắn địa chỉ API của bản web
const anhUrl = u => u ? (window.ML_API || '') + u : '';
const anhTag = ma => { const d = D && D.anhDem && D.anhDem[ma]; if (!d) return '';
  return `<span class="tag ok" title="Ảnh / video trong kho Drive">Ảnh ${d[0]}${d[1] ? ' · video ' + d[1] : ''}</span>${d[2] ? ` <span class="tag warn">nháp ${d[2]}</span>` : ''}`; };
function cardAnh(ma) {
  return ma ? `<div class="card"><h2>Ảnh & video <span class="muted" style="font-weight:400;font-size:13px">${esc(ma)}</span></h2><div id="anhBox" data-ma="${esc(ma)}"><div class="loading">Đang đọc…</div></div></div>` : '';
}
// Ảnh listing (Note 37, sửa theo review Codex 06/10): nhóm Đã duyệt / Nháp, bìa = file <MÃ>_01, ảnh biến thể hiện SKU,
// ô ảnh là nút (bàn phím được), xem lớn chỉ đi qua ẢNH (video mở Drive riêng), Esc chỉ đóng lớp xem ảnh.
async function napAnh(ma) {
  const box = () => { const b = $('anhBox'); return b && b.dataset.ma === ma ? b : null; };
  if (!ma || !box()) return;
  try {
    const r = await call('anhListing', TOKEN, ma);
    const b = box(); if (!b) return;
    const moDrive = r.moDrive ? `<a class="btn ghost" href="${esc(r.moDrive)}" target="_blank" rel="noopener noreferrer">${r.moDriveLaGoc ? 'Mở kho chung ↗' : 'Mở thư mục trên Drive ↗'}</a>
      ${r.moDriveLaGoc ? `<div class="muted" style="margin-top:4px">Thư mục của mã này chưa có link Drive — trong kho chung tìm thư mục bắt đầu bằng <b>${esc(ma)}_</b>${r.thuMuc ? ' (' + esc(r.thuMuc) + ')' : ''}. Không để ảnh ở gốc kho.</div>` : ''}` : '';
    const chan = `<div class="muted" style="margin-top:8px">Kho: Drive xfiltertool / MASTER_LISTING${r.thuMuc ? ' / ' + esc(r.thuMuc) : ''}${r.capNhat ? ' · ảnh đồng bộ lúc ' + esc(r.capNhat.replace('T', ' ').slice(0, 16)) : ''}.
      Ảnh mới: để vào thư mục của mã (bản chưa duyệt để trong <b>_nhap</b>), rồi chạy <b>DONG_BO_ANH.command</b>. Ảnh trong kho chưa có nghĩa là đã đăng lên sàn/web.</div>`;
    if (!r.tep || !r.tep.length) { b.innerHTML = `<div class="muted">Chưa có ảnh / video cho mã này.</div><div style="margin-top:8px">${moDrive}</div>${chan}`; return; }
    const anh = r.tep.filter(t => t.loai === 'anh' && t.vua);      // xem lớn chỉ đi qua ảnh xem được
    const o = (t) => { const i = r.tep.indexOf(t);
      const nhan = [t.bia ? '<span class="tag info">bìa</span>' : '', t.sku ? `<span class="tag info">SKU ${esc(t.sku)}</span>` : '',
                    t.loai === 'video' ? '<span class="tag info">video</span>' : '', t.nhap ? '<span class="tag warn">nháp</span>' : '',
                    t.loi ? '<span class="tag bad">lỗi</span>' : ''].join(' ');

function xemAnh(ds, i, quay) {

  document.body.appendChild(o);
  const dong = () => { o.remove(); document.removeEventListener('keydown', phim, true); if (quay && quay.focus) quay.focus(); };
  const di = d => { const k = i + d; if (k >= 0 && k < ds.length) { document.removeEventListener('keydown', phim, true); xemAnh(ds, k, quay); } };
  function phim(e) {
    if (!document.body.contains(o)) { document.removeEventListener('keydown', phim, true); return; }
    if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); dong(); }   // chỉ đóng lớp xem ảnh, giữ khung listing
    else if (e.key === 'ArrowLeft') di(-1);

  o.onclick = e => { const b = e.target.closest('[data-b]'); if (b) { const d = +b.dataset.b; d ? di(d) : dong(); } else if (e.target === o) dong(); };
  const nut = o.querySelector('[data-b="0"]'); if (nut) nut.focus();
}

function bindItems(root) {

  const uniq = k => [...new Set(bt.map(b => String(b[k] == null ? '' : b[k])))];
  const one = k => { const u = uniq(k); return u.length === 1 ? (u[0] || '(trống)') : u.map(x => x || '(trống)').join(' / '); };
  const row = (k, v) => `<tr><th style="width:38%">${esc(k)}</th><td>${v}</td></tr>`;
  const seoT = p['SEO title'] || (mw && mw['SEO title']) || '', seoD = p['SEO description'] || (mw && mw['SEO description']) || '';
  return `<div class="card"><h2>Trên Haravan (form sản phẩm)</h2><div class="scroll"><table>
    ${row('Thương hiệu', esc(p['Thương hiệu']))}
    ${row('Loại', esc(p['Loại']))}
    ${row('Hiển thị', esc(p['Hiển thị']))}
    ${p['Cách đăng'] ? row('Cách đăng', p['Cách đăng'] === 'Tạo mới' ? 'Tạo mới' : '<b>Sửa đổi trang cũ</b> (mã ' + esc(p['Mã sản phẩm Haravan']) + ', giữ URL)') : ''}

  if (!/^(\d{1,3}([.,]\d{3})*|\d+)$/.test(s)) return NaN; const g = Number(s.replace(/[.,]/g, '')); return g > 0 && g < 1e8 ? g : NaN; };

  const hopDan = () => {
    $('gvHop').innerHTML = `<div class="card" style="margin:8px 0 0;background:var(--chip)"><b>Dán nhiều giá</b>
      <div class="muted">Mỗi dòng: SKU, giá về kho, (ngày áp dụng — bỏ trống = từ trước tới nay), cách nhau bằng Tab hoặc dấu ;. Chép 2–3 cột từ Excel/Numbers rồi dán vào đây.</div>

        return { sku: c[0], gia: g, tuNgay: tu, ok: c[0] && g != null && !Number.isNaN(g) && tu != null, moi: !biet.has(String(c[0]).toUpperCase().replace(/\s+/g, ' ')) };

      const tot = ds.filter(x => x.ok);
      $('gvXt').innerHTML = `<div class="scroll" style="margin-top:6px"><table><tr><th>SKU</th><th class="num">Giá</th><th>Áp dụng từ</th><th></th></tr>

        <button class="btn" id="gvLuuDan" style="margin-top:6px" ${tot.length && tot.length === ds.length ? '' : 'disabled'}>Lưu ${tot.length} giá</button>
        ${tot.length !== ds.length ? '<div class="muted">Sửa các dòng báo sai rồi bấm Xem trước lại.</div>' : ''}`;
      if ($('gvLuuDan')) $('gvLuuDan').onclick = () => luuGia(tot.map(x => ({ sku: x.sku, gia: x.gia, tuNgay: x.tuNgay, ghiChu: 'dán từ bảng' })));
    };
  };
  const hopGoiY = () => {
    $('gvHop').innerHTML = `<div class="card" style="margin:8px 0 0;background:var(--chip)"><b>${fmt(goiY.length)} giá gợi ý</b> cho mã chưa có giá — áp dụng <b>từ trước tới nay</b>.

  if (GV.hop === 'dan') hopDan(); else if (GV.hop === 'gy' && goiY.length) hopGoiY();
  ve();
}

/* ============ Shopee: cụm shop (Phụ kiện MLKK / robot / ô tô) → shop; Tổng quan; Theo SKU ============ */
let SP = { sub: 'tq', shop: '', dong: '', q: '', n: 100 };
function spCum() {
  // cụm theo mã shop (du_lieu/nhom_shop.json) → tên shop trong dữ liệu
  const ten = Object.fromEntries(Object.entries(D.shopMa || {}).map(([t, m]) => [m, t]));
  const cum = (D.nhomShop || []).map(c => ({ ma: c.ma, ten: c.ten, ghiChu: c.ghi_chu || '', shops: (c.shopee || []).map(m => ten[m]).filter(Boolean) }));
  const co = new Set(cum.flatMap(c => c.shops));
  const le = D.shops.filter(s => !co.has(s));
  if (le.length) cum.push({ ma: 'KHAC', ten: 'Shop khác', ghiChu: '', shops: le });
  return cum;
}
function vShopee() {
  const shopMa = D.shopMa || {};
  const cnt = ss => D.LIST.filter(l => ss.includes(l['Shop'])).length;
  const cums = spCum();
  const cur = cums.find(c => c.ma === SP.sub);
  const subs = [['tq', 'Tổng quan']].concat(cums.map(c => [c.ma, c.ten + ' (' + cnt(c.shops) + ')'])).concat([['sku', 'Theo SKU (' + D.SKU.length + ')']]);
  $('main').innerHTML = `
    <div class="card" style="padding-bottom:8px"><div class="row" style="gap:4px">${subs.map(([k, t]) => `<span class="chip ${SP.sub === k ? 'on' : ''}" data-spsub="${esc(k)}">${esc(t)}</span>`).join('')}</div>
      ${cur && cur.shops.length > 1 ? `<div class="row" style="gap:4px;margin-top:6px"><span class="chip ${SP.shop ? '' : 'on'}" data-spshop="">Cả cụm</span>${cur.shops.map(s => `<span class="chip ${SP.shop === s ? 'on' : ''}" data-spshop="${esc(s)}">${esc(s)}${shopMa[s] ? ' · ' + esc(shopMa[s]) : ''} (${cnt([s])})</span>`).join('')}</div>` : ''}
      <div class="muted" style="margin-top:6px">Dữ liệu Shopee: ${esc(nhanShopee())}. Mã listing Shopee = mã shop + số (vd LKX-0001), cấp một lần, không đổi.</div></div>
    <div id="spbody"></div>`;
  document.querySelectorAll('[data-spsub]').forEach(c => c.onclick = () => { SP.sub = c.dataset.spsub; SP.shop = ''; SP.dong = ''; SP.q = ''; SP.n = 100; vShopee(); });
  document.querySelectorAll('[data-spshop]').forEach(c => c.onclick = () => { SP.shop = c.dataset.spshop; SP.dong = ''; SP.n = 100; vShopee(); });
  if (SP.sub === 'tq') return spTongQuan(cums);
  if (SP.sub === 'sku') return spTheoSku();
  if (!cur) { SP.sub = 'tq'; return vShopee(); }
  if (!cur.shops.length) {
    $('spbody').innerHTML = `<div class="card"><h2>${esc(cur.ten)}</h2><div class="muted">Chưa có shop trong cụm này.${cur.ghiChu ? ' ' + esc(cur.ghiChu) + '.' : ''}</div></div>`;
    return;
  }
  spShop(SP.shop ? [SP.shop] : cur.shops);
}
function spTongQuan(cums) {
  const shopMa = D.shopMa || {};
  const dongs = [...new Set(D.LIST.map(l => l['Dòng hàng']).filter(Boolean))];
  const tinh = ss => { const ls = D.LIST.filter(l => ss.includes(l['Shop']));
    return { n: ls.length, pl: ls.reduce((a, l) => a + num(l['Số phân loại']), 0), ton: ls.reduce((a, l) => a + num(l['Tổng tồn']), 0),
      d: Object.fromEntries(dongs.map(g => [g, ls.filter(l => l['Dòng hàng'] === g).length])) }; };
  const dong = (nhan, r, dam) => `<tr${dam ? ' style="background:var(--chip);font-weight:600"' : ''}><td>${nhan}</td><td class="num">${fmt(r.n)}</td><td class="num">${fmt(r.pl)}</td><td class="num hide-m">${fmt(r.ton)}</td>${dongs.map(g => `<td class="num hide-m">${r.d[g] ? fmt(r.d[g]) : '—'}</td>`).join('')}</tr>`;
  $('spbody').innerHTML = `<div class="card"><h2>Theo cụm và shop</h2><div class="scroll"><table>
    <tr><th>Cụm / shop</th><th class="num">Listing</th><th class="num">Phân loại</th><th class="num hide-m">Tổng tồn</th>${dongs.map(g => `<th class="num hide-m">${esc(g)}</th>`).join('')}</tr>
    ${cums.map(c => dong(`<a href="#" data-spgo="${esc(c.ma)}|">${esc(c.ten)}</a>`, tinh(c.shops), true) +
      (c.shops.length ? c.shops.map(s => dong(`&nbsp;&nbsp;<a href="#" data-spgo="${esc(c.ma)}|${esc(s)}">${esc(s)}</a> <span class="sku">${esc(shopMa[s] || '')}</span>`, tinh([s]))).join('')
        : `<tr><td colspan="${4 + dongs.length}" class="muted">&nbsp;&nbsp;Chưa có shop${c.ghiChu ? ' — ' + esc(c.ghiChu) : ''}</td></tr>`)).join('')}
  </table></div></div>`;
  document.querySelectorAll('[data-spgo]').forEach(a => a.onclick = e => { e.preventDefault(); const [c, s] = a.dataset.spgo.split('|'); SP.sub = c; SP.shop = s; vShopee(); });
}
function spShop(shops) {
  const ls = D.LIST.filter(l => shops.includes(l['Shop']));
  const dongs = [...new Set(ls.map(l => l['Dòng hàng']).filter(Boolean))];
  $('spbody').innerHTML = `<div class="card">
      <div class="row"><input id="spq" class="search" type="search" placeholder="Lọc: mã listing, tên, SKU" value="${esc(SP.q)}"></div>
      <div style="margin-top:8px"><span class="chip ${SP.dong ? '' : 'on'}" data-spdong="">Mọi dòng hàng</span>${dongs.map(g => `<span class="chip ${SP.dong === g ? 'on' : ''}" data-spdong="${esc(g)}">${esc(g)} (${ls.filter(l => l['Dòng hàng'] === g).length})</span>`).join('')}</div>
    </div><div class="card" id="spres"></div>`;
  const draw = () => {
    const words = norm(SP.q).split(' ').filter(Boolean);
    const rows = ls.filter(l => (!SP.dong || l['Dòng hàng'] === SP.dong) && words.every(w => l._k.indexOf(w) >= 0));
    $('spres').innerHTML = `<h2>${rows.length} listing</h2>` + (rows.length ? rows.slice(0, SP.n).map(listItem).join('') : '<div class="muted">Không có listing khớp.</div>') +
      (rows.length > SP.n ? `<div style="margin-top:10px"><button class="btn ghost" id="spMore">Xem thêm (${rows.length - SP.n} listing)</button></div>` : '');
    bindItems($('spres'));
    const m = $('spMore'); if (m) m.onclick = () => { SP.n += 200; draw(); };
  };
  $('spq').oninput = () => { SP.q = $('spq').value; SP.n = 100; clearTimeout(spShop.h); spShop.h = setTimeout(draw, 150); };
  document.querySelectorAll('[data-spdong]').forEach(c => c.onclick = () => { SP.dong = c.dataset.spdong; SP.n = 100; spShop(shops); });
  draw();
}
function spTheoSku() {
  const cols = Object.keys(D.SKU[0] || {}).filter(k => /^Listing ở /.test(k));
  $('spbody').innerHTML = `<div class="card"><div class="row"><input id="spq" class="search" type="search" placeholder="Lọc SKU (TO01, ETO01, CF8116…)" value="${esc(SP.q)}"></div></div><div class="card" id="spres"></div>`;
  const draw = () => {
    const qf = flat(SP.q);
    const rows = D.SKU.filter(x => !qf || x._k.indexOf(qf) >= 0);
    $('spres').innerHTML = `<h2>${rows.length} SKU</h2><div class="scroll"><table><tr><th>SKU</th><th>Dòng hàng</th>${cols.map(c => `<th class="num hide-m">${esc(c.replace('Listing ở ', ''))}</th>`).join('')}<th class="num">Listing</th><th class="num">Giá (₫)</th></tr>
      ${rows.slice(0, SP.n).map(x => `<tr><td><span class="sku" data-sku="${esc(x['SKU chuẩn'])}" style="cursor:pointer">${esc(x['SKU chuẩn'])}</span> ${statusTag(x['Trạng thái'])}</td><td>${esc(x['Dòng hàng'])}</td>${cols.map(c => `<td class="num hide-m">${esc(x[c] || '—')}</td>`).join('')}<td class="num">${esc(x['Tổng listing'])}</td><td class="num" style="white-space:normal;min-width:84px">${khoangGia(x['Giá thấp nhất'], x['Giá cao nhất'])}</td></tr>`).join('')}</table></div>` +
      (rows.length > SP.n ? `<div style="margin-top:10px"><button class="btn ghost" id="spMore">Xem thêm (${rows.length - SP.n})</button></div>` : '');
    $('spres').querySelectorAll('[data-sku]').forEach(el => el.onclick = () => openSku(el.dataset.sku));

async function hnHanhDong(viec, ds) {

  } catch (e) { toast(e.message); }
}

/* Hiện HTML mô tả ngay trong trang: chỉ giữ thẻ / thuộc tính an toàn (bỏ script, iframe, style, on*, javascript:) */
function hnSach(html) {
  const TAG = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'A', 'IMG', 'SPAN', 'DIV', 'BLOCKQUOTE', 'HR', 'SUB', 'SUP']);
  const ATTR = { A: ['href', 'title'], IMG: ['src', 'alt', 'title'], TD: ['colspan', 'rowspan'], TH: ['colspan', 'rowspan'] };
  const doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html');
  const lam = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 8) return c.remove();
    if (c.nodeType !== 1) return;
    if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'FORM', 'INPUT', 'BUTTON', 'LINK', 'META'].includes(c.tagName)) return c.remove();
    lam(c);
    if (!TAG.has(c.tagName)) { c.replaceWith(...c.childNodes); return; }
    [...c.attributes].forEach(a => { if (!(ATTR[c.tagName] || []).includes(a.name) || /^\s*javascript:/i.test(a.value)) c.removeAttribute(a.name); });
    if (c.tagName === 'A') { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener'); }
    if (c.tagName === 'IMG') c.setAttribute('referrerpolicy', 'no-referrer');
  });
  const root = doc.body.firstChild; lam(root);
  return root.innerHTML.trim();
}
function hnZoom(e) {
  const t = e.target.closest && e.target.closest('[data-zoom]');
  if (!t || VIEW !== 'hn') return;
  const o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out';
  o.innerHTML = `<img src="${esc(t.dataset.zoom)}" referrerpolicy="no-referrer" style="max-width:94vw;max-height:94vh;background:#fff">`;
  o.onclick = () => o.remove(); document.body.appendChild(o);
}

      <span class="chip ${CHO.chiChua ? 'on' : ''}" id="fChua">Chưa quyết (${p.all})</span><span class="chip ${CHO.chiChua ? '' : 'on'}" id="fAll">Tất cả</span>
      <span class="sp" style="flex:1"></span><button class="btn ghost" id="addQ">+ Thêm câu hỏi / việc</button></div>
      <div class="muted" style="margin-top:6px">Bấm lưu là ghi vào cơ sở dữ liệu (có giờ, người bấm, sửa lại được). Claude đọc khi làm đợt sau. Không tự đổi Shopee hay web Xfilter.vn.</div></div>
    <div class="card"><h2>Câu hỏi (${p.ch} chưa trả lời)</h2>
      ${Object.keys(nhom).length ? Object.keys(nhom).map(k => `<h3 style="margin-top:6px">${esc(k)}</h3>` + nhom[k].map(qCard).join('')).join('') : '<div class="muted">Không còn câu nào.</div>'}</div>
    <div class="card"><h2>Phân loại chờ duyệt (${p.cho} chưa quyết)</h2>
      <div class="muted" style="margin-bottom:8px">Có lên web không. Quyết định lưu trong app (cơ sở dữ liệu Master Listing), có bản sao ở tab QUYET_DINH của Google Sheet.</div>
      ${D.CHO.filter(showC).map(choCard).join('') || '<div class="muted">Không còn.</div>'}</div>
    <div class="card"><h2>Phân loại cần mã (${p.ma} chưa có)</h2>
      <div class="muted" style="margin-bottom:8px">Phân loại chưa có SKU dùng được. Anh gõ SKU đúng (hoặc "Bỏ" nếu tổ hợp không tồn tại).</div>
      ${D.CAN_MA.filter(showM).map(maCard).join('') || '<div class="muted">Không còn.</div>'}</div>`;
  $('fChua').onclick = () => { CHO.chiChua = true; vCho(); };
  $('fAll').onclick = () => { CHO.chiChua = false; vCho(); };
  $('addQ').onclick = addQuestion;
  $('main').querySelectorAll('[data-pick]').forEach(c => c.onclick = () => {
    const box = c.closest('.q'); box.querySelector('[name=qd]').value = c.dataset.pick;
    box.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x === c));
  });
  $('main').querySelectorAll('[data-save]').forEach(b => b.onclick = () => save(b));
  $('main').querySelectorAll('[data-list]').forEach(el => el.onclick = e => { e.preventDefault(); openListing(el.dataset.list); });
}
function chips(opts, cur) { return opts.map(o => `<span class="chip ${cur === o ? 'on' : ''}" data-pick="${esc(o)}">${esc(o)}</span>`).join(''); }
function done(d) { return d ? `<div class="muted">Đã lưu: <b>${esc(d.qd)}</b>${d.ghiChu ? ' — ' + esc(d.ghiChu) : ''} · ${esc(d.luc || '')}</div>` : ''; }
function qCard(q) {
  const d = decision('CAU_HOI', q['Mã']) || (q['Trả lời của anh'] ? { qd: q['Trả lời của anh'], ghiChu: q['Ghi chú của anh'], luc: q['Cập nhật lúc'] } : null);
  const opts = String(q['Gợi ý (cách nhau bằng |)'] || '').split('|').map(s => s.trim()).filter(Boolean);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CAU_HOI" data-khoa="${esc(q['Mã'])}" data-mota="${esc(q['Câu hỏi'])}">
    <div class="qt">${esc(q['Câu hỏi'])}</div>
    ${q['Bối cảnh'] ? `<div class="muted">${esc(q['Bối cảnh'])}</div>` : ''}${done(d)}
    <div class="act"><div>${chips(opts, d && d.qd)}</div>
      <input type="text" name="qd" placeholder="Trả lời (chọn gợi ý hoặc gõ)" value="${esc(d ? d.qd : '')}">
      <input type="text" name="gc" placeholder="Ghi chú (không bắt buộc)" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
function choCard(r) {
  const d = decision('CHO_DUYET', r['Mã phân loại']) || (r['Anh quyết'] ? { qd: r['Anh quyết'], ghiChu: r['Ghi chú của anh'] } : null);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CHO_DUYET" data-khoa="${esc(r['Mã phân loại'])}" data-mota="${esc(r['Tên phân loại'])}">
    <div class="qt">${esc(r['Tên phân loại'])} <span class="muted">· SKU ${esc(r['SKU gốc'])} · ${esc(r['Giá'])} · tồn ${esc(r['Tồn'])}</span></div>
    <div class="muted">${esc(r['Lý do'])}</div>
    <div class="muted"><a href="#" data-list="${esc(r['Shopee'])}">${esc(r['Listing Shopee']).slice(0, 90)}</a></div>${done(d)}
    <div class="act"><div>${chips(['Giữ lên web', 'Bỏ'], d && d.qd)}</div>
      <input type="hidden" name="qd" value="${esc(d ? d.qd : '')}">
      <input type="text" name="gc" placeholder="Ghi chú (ví dụ: mã đúng là …)" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
function maCard(r) {
  const d = decision('CAN_MA', r['Mã phân loại']);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CAN_MA" data-khoa="${esc(r['Mã phân loại'])}" data-mota="${esc(r['Tên phân loại'])}">
    <div class="qt">${esc(r['Dòng xe'])} ${esc(r['Đời xe'])} <span class="muted">· ${esc(r['Tên phân loại'])}</span></div>
    <div class="muted">SKU gốc: ${esc(r['SKU gốc'])} · ${esc(r['Giá'])} · tồn ${esc(r['Tồn'])} · <a href="#" data-list="${esc(r['Shopee'])}">${esc(r['Listing Shopee']).slice(0, 70)}</a></div>${done(d)}
    <div class="act"><div class="row"><input type="text" name="qd" placeholder="SKU đúng (vd ETO01) hoặc Bỏ" value="${esc(d ? d.qd : '')}" style="flex:1">
      <span class="chip" data-pick="Bỏ">Bỏ</span></div>
      <input type="text" name="gc" placeholder="Ghi chú" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
async function save(btn) {
  const box = btn.closest('.q');
  const d = { loai: box.dataset.loai, khoa: box.dataset.khoa, moTa: box.dataset.mota,
    qd: box.querySelector('[name=qd]').value.trim(), ghiChu: box.querySelector('[name=gc]').value.trim() };
  if (!d.qd) { toast('Chưa chọn / nhập quyết định.'); return; }
  btn.disabled = true; btn.textContent = 'Đang lưu…';
  try {
    const r = await call('luuQuyetDinh', TOKEN, d);
    D.qd[d.loai + '|' + d.khoa] = { qd: r.qd, ghiChu: r.ghiChu, luc: r.luc };
    toast('Đã lưu vào cơ sở dữ liệu Master Listing.');
    render();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Lưu'; }
}
function addQuestion() {
  openPanel('Thêm câu hỏi / việc cần nhớ', `<div class="card">
    <input id="nqNhom" type="text" placeholder="Nhóm (vd: Nội dung, Ảnh, Dữ liệu web)" style="width:100%;margin-bottom:8px">
    <textarea id="nqCau" placeholder="Câu hỏi / việc cần quyết"></textarea>
    <textarea id="nqBc" placeholder="Bối cảnh (không bắt buộc)" style="margin-top:8px"></textarea>
    <input id="nqGy" type="text" placeholder="Gợi ý trả lời, cách nhau bằng | (vd: Có|Không)" style="width:100%;margin:8px 0">
    <div class="err" id="nqErr"></div><button class="btn" id="nqBtn">Thêm</button></div>`);
  $('nqBtn').onclick = async () => {
    try {
      await call('themCauHoi', TOKEN, { nhom: $('nqNhom').value, cauHoi: $('nqCau').value, boiCanh: $('nqBc').value, goiY: $('nqGy').value });
      closePanel(); toast('Đã thêm.'); VIEW = 'cho'; start();
    } catch (e) { $('nqErr').textContent = e.message; }
  };
}

/* ============ Vào app ============ */
if (TOKEN) start(); else showLogin();
</script>
</body>
</html>
