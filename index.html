<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master Listing</title>
<meta name="description" content="XFILTER – tra cứu SKU và listing nội bộ">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12355b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Listing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// Thay google.script.run: gọi Apps Script bằng POST, không gửi cookie Google
(function () {
  const API = 'https://script.google.com/macros/s/AKfycbyP5oW69-jAF3eTc8AxogX1YFHUruLPxTANOaQ-hblF4ZWoKY7UjqQgDjKGa-wiFHDsWA/exec';
  function mk(ok, bad) {
    return new Proxy({}, { get(_, fn) {
      if (fn === 'withSuccessHandler') return f => mk(f, bad);
      if (fn === 'withFailureHandler') return f => mk(ok, f);
      return (...args) => fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
        .then(r => { if (!r.ok) throw new Error('Máy chủ trả lỗi ' + r.status); return r.json(); })
        .then(j => j.ok ? ok && ok(j.res) : bad && bad(new Error(j.err)),
              e => bad && bad(new Error('Không kết nối được máy chủ (' + e.message + '). Thử tải lại trang.')));
    } });
  }
  window.google = { script: { run: mk() } };
})();
</script>

<style>
  :root {
    --brand: #12355b; --brand-2: #1f5a8f; --bg: #eef2f6; --card: #fff; --ink: #1b2430; --muted: #66707c;
    --line: #dde3ea; --ok: #1e7f4f; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fff3d6; --bad: #a12a2a; --bad-bg: #fde8e8;
    --chip: #eef3f9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand-2); }
  .hidden { display: none !important; }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .top b { letter-spacing: .06em; font-size: 15px; }
  .top .sp { flex: 1; }
  .top button { background: rgba(255,255,255,.12); border: 0; color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  nav { display: flex; gap: 2px; padding: 0 8px; overflow-x: auto; }
  nav button { background: none; border: 0; color: rgba(255,255,255,.75); padding: 10px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.on { color: #fff; border-bottom-color: #f2b632; font-weight: 600; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: #f2b632; color: #222; font-size: 12px; font-weight: 700; text-align: center; margin-left: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.click { cursor: pointer; }
  .stat.click:hover { border-color: var(--brand-2); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password], input[type=search], select, textarea {
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: #fff; min-width: 0; }
  textarea { width: 100%; min-height: 54px; resize: vertical; }
  .search { flex: 1; min-width: 200px; font-size: 16px; }
  .btn { border: 1px solid var(--brand-2); background: var(--brand-2); color: #fff; padding: 8px 14px; border-radius: 9px; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--brand-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .chip { display: inline-block; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; margin: 2px 4px 2px 0; }
  .chip.on { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
  .tag { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.info { background: var(--chip); color: var(--brand); }
  .item { padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: #f7f9fc; }
  .item:last-child { border-bottom: 0; }
  .item .t { font-weight: 600; }
  .links a { font-size: 13px; margin-right: 10px; white-space: nowrap; }
  .sku { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
  .ws { white-space: pre-wrap; }
  /* Bảng chi tiết bật lên */
  .ov { position: fixed; inset: 0; background: rgba(10,20,35,.45); z-index: 20; display: flex; justify-content: flex-end; }
  .panel { background: var(--bg); width: min(760px, 100%); height: 100%; overflow-y: auto; padding: 0 0 30px; }
  .panel .ph { position: sticky; top: 0; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; gap: 10px; align-items: center; z-index: 2; }
  .panel .ph .t { flex: 1; font-weight: 700; }
  .panel .ph button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .panel .pb { padding: 14px 16px; }
  /* Đăng nhập */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--brand); }
  .login .box { background: #fff; border-radius: 16px; padding: 24px; width: min(360px, 100%); }
  .login input { width: 100%; margin: 6px 0 10px; font-size: 16px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b2430; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 50; font-size: 14px; max-width: 90vw; }
  .loading { padding: 30px; text-align: center; color: var(--muted); }
  .q { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .q.done { border-left: 4px solid var(--ok); }
  .q.todo { border-left: 4px solid #f2b632; }
  .q .qt { font-weight: 600; margin-bottom: 4px; }
  .q .act { margin-top: 8px; display: grid; gap: 6px; }
  @media (max-width: 640px) {
    main { padding: 12px; }
    .hide-m { display: none; }
    th, td { padding: 6px 5px; }
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="box">
    <div style="font-weight:800;letter-spacing:.12em;color:var(--brand)">MASTER LISTING</div>
    <div class="muted" style="margin-bottom:14px">XFILTER · SKU và listing đa kênh</div>
    <div id="loginNew" class="hidden">
      <div class="muted">Lần đầu mở app: đặt mật khẩu Admin (6–32 ký tự).</div>
      <input id="pwNew1" type="password" placeholder="Mật khẩu mới" autocomplete="new-password">
      <input id="pwNew2" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
    </div>
    <div id="loginOld" class="hidden">
      <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" style="width:100%">Đăng nhập</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="top">
      <b>MASTER LISTING</b><span class="sp"></span>
      <button id="reloadBtn" title="Đọc lại dữ liệu từ Sheet">↻ Tải lại</button>
      <button id="pwBtn">Đổi mật khẩu</button>
      <button id="outBtn">Thoát</button>
    </div>
    <nav id="nav">
      <button data-v="tq" class="on">Tổng quan</button>
      <button data-v="tc">Tra cứu</button>
      <button data-v="web">Web Xfilter.vn</button>
      <button data-v="cho">Chờ duyệt <span class="badge hidden" id="choBadge"></span></button>
    </nav>
  </header>
  <main id="main"><div class="loading">Đang đọc dữ liệu từ Sheet…</div></main>
</div>

<div id="ov" class="ov hidden"><div class="panel"><div class="ph"><span class="t" id="pT"></span><button id="pClose">Đóng</button></div><div class="pb" id="pB"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ============ Tiện ích ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim();
const flat = s => norm(s).replace(/[\s\-_.\/]/g, '');
const fmt = n => Number(n || 0).toLocaleString('vi-VN');
const num = s => Number(String(s == null ? '' : s).replace(/[^\d\-]/g, '')) || 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 3500); }
function call(fn, ...args) {
  return new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => {
    if (String(e && e.message).indexOf('PHIEN_HET_HAN') >= 0) { logoutLocal(); bad(new Error('Phiên đăng nhập đã hết, hãy đăng nhập lại.')); }
    else bad(e);
  })[fn](...args));
}
// Bảng {h, r} → mảng object theo tên cột
function objs(t) { return (t && t.r ? t.r : []).map(r => { const o = {}; t.h.forEach((h, i) => o[h] = r[i]); return o; }); }
const ids = s => (String(s || '').match(/\d{6,}/g) || []);

let TOKEN = '';
try { TOKEN = sessionStorage.getItem('ml_token') || ''; } catch (e) {}
let D = null;          // dữ liệu khởi động
let VIEW = 'tq';

/* ============ Đăng nhập ============ */
let firstTime = false;
async function showLogin() {
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('loginErr').textContent = '';
  try {
    const s = await call('trangThaiMatKhau');
    firstTime = !s.daCo;
  } catch (e) { $('loginErr').textContent = e.message; }
  $('loginNew').classList.toggle('hidden', !firstTime);
  $('loginOld').classList.toggle('hidden', firstTime);
  $('loginBtn').textContent = firstTime ? 'Đặt mật khẩu và vào app' : 'Đăng nhập';
  (firstTime ? $('pwNew1') : $('pw')).focus();
}
async function doLogin() {
  const btn = $('loginBtn'); btn.disabled = true; $('loginErr').textContent = '';
  try {
    let r;
    if (firstTime) {
      if ($('pwNew1').value !== $('pwNew2').value) throw new Error('Hai lần nhập mật khẩu không khớp.');
      r = await call('datMatKhauDau', $('pwNew1').value);
    } else r = await call('login', $('pw').value);
    TOKEN = r.token; try { sessionStorage.setItem('ml_token', TOKEN); } catch (e) {}
    $('pw').value = $('pwNew1').value = $('pwNew2').value = '';
    start();
  } catch (e) { $('loginErr').textContent = e.message; }
  btn.disabled = false;
}
function logoutLocal() { TOKEN = ''; try { sessionStorage.removeItem('ml_token'); } catch (e) {} showLogin(); }
$('loginBtn').onclick = doLogin;
['pw', 'pwNew2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
$('outBtn').onclick = () => { call('logout', TOKEN).catch(() => {}); logoutLocal(); };
$('pwBtn').onclick = () => {
  openPanel('Đổi mật khẩu', `
    <div class="card"><input id="op" type="password" placeholder="Mật khẩu hiện tại" style="width:100%;margin-bottom:8px">
    <input id="np1" type="password" placeholder="Mật khẩu mới (6–32 ký tự)" style="width:100%;margin-bottom:8px">
    <input id="np2" type="password" placeholder="Nhập lại mật khẩu mới" style="width:100%;margin-bottom:8px">
    <div class="err" id="npErr"></div><button class="btn" id="npBtn">Lưu</button></div>`);
  $('npBtn').onclick = async () => {
    try {
      if ($('np1').value !== $('np2').value) throw new Error('Hai lần nhập không khớp.');
      await call('doiMatKhau', TOKEN, $('op').value, $('np1').value);
      closePanel(); toast('Đã đổi mật khẩu.');
    } catch (e) { $('npErr').textContent = e.message; }
  };
};

/* ============ Khởi động ============ */
async function start() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('main').innerHTML = '<div class="loading">Đang đọc dữ liệu từ Sheet…</div>';
  try {
    D = await call('bootstrap', TOKEN);
    prep();
    render();
  } catch (e) { $('main').innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; }
}
$('reloadBtn').onclick = () => start();
$('nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; VIEW = b.dataset.v; render(); };

// Chuẩn bị dữ liệu: object hoá + chỉ mục tìm kiếm
function prep() {
  D.SKU = objs(D.sku); D.LIST = objs(D.list); D.TRANG = objs(D.trang); D.BT = objs(D.bt);
  D.CAN_MA = objs(D.canMa); D.CHO = objs(D.cho); D.MOTA = objs(D.mota); D.CH = objs(D.cauHoi);
  D.MT = {}; objs(D.moTaWeb).forEach(m => D.MT[m['URL (handle)']] = m);
  D.SKU.forEach(s => s._k = flat(s['SKU chuẩn'] + ' ' + s['Gồm mã cũ']));
  D.LIST.forEach(l => l._k = norm(l['Tên listing'] + ' ' + l['SKU chuẩn'] + ' ' + l['Mã listing'] + ' ' + l['Shop']));
  D.TRANG.forEach(p => p._k = norm(p['Tên trang'] + ' ' + p['Hãng xe'] + ' ' + p['Dòng xe'] + ' ' + p['SKU'] + ' ' + p['URL (handle)'] + ' ' + (p['Mã listing'] || '')));
  D.shops = [...new Set(D.LIST.map(l => l['Shop']).filter(Boolean))];
}
function shopUrl(shop, id) { const s = D.shopIds[shop]; return s && id ? 'https://shopee.vn/product/' + s + '/' + id : ''; }
function editUrl(id) { return id ? 'https://banhang.shopee.vn/portal/product/' + id : ''; }
function xfShop() { return D.shops.find(s => norm(s) === 'xfilter') || 'xfilter'; }
function links(shop, id) {
  const u = shopUrl(shop, id);
  return '<span class="links">' + (u ? `<a href="${u}" target="_blank" rel="noopener">Mở Shopee ↗</a>` : '') +
    (id ? `<a href="${editUrl(id)}" target="_blank" rel="noopener">Sửa (Seller Centre) ↗</a>` : '') + '</span>';
}
function statusTag(s) {
  const n = norm(s);
  if (!s) return '';
  const cls = /san sang/.test(n) ? 'ok' : /can (duyet|kiem tra)|chua ra/.test(n) ? 'warn' : 'info';
  return `<span class="tag ${cls}">${esc(s)}</span>`;
}
function decision(loai, khoa) { return D.qd[loai + '|' + khoa] || null; }
function pending() {
  const ch = D.CH.filter(q => !(decision('CAU_HOI', q['Mã']) || q['Trả lời của anh'])).length;
  const cho = D.CHO.filter(r => !(decision('CHO_DUYET', r['Mã phân loại']) || r['Anh quyết'])).length;
  const ma = D.CAN_MA.filter(r => !decision('CAN_MA', r['Mã phân loại'])).length;
  return { ch, cho, ma, all: ch + cho + ma };
}
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW));
  const p = pending(); const bd = $('choBadge');
  bd.textContent = p.all; bd.classList.toggle('hidden', !p.all);
  ({ tq: vTongQuan, tc: vTraCuu, web: vWeb, cho: vCho })[VIEW]();
  window.scrollTo(0, 0);
}

/* ============ Tổng quan ============ */
function vTongQuan() {
  const L = D.LIST, P = D.TRANG, p = pending();
  const plTong = L.reduce((a, l) => a + num(l['Số phân loại']), 0);
  const skuCheck = D.SKU.filter(s => /kiem tra/.test(norm(s['Trạng thái']))).length;
  const ready = P.filter(x => /san sang/.test(norm(x['Trạng thái']))).length;
  const byShop = D.shops.map(s => {
    const ls = L.filter(l => l['Shop'] === s);
    return { s, n: ls.length, pl: ls.reduce((a, l) => a + num(l['Số phân loại']), 0), ton: ls.reduce((a, l) => a + num(l['Tổng tồn']), 0),
      chua: ls.filter(l => /chua ra/.test(norm(l['Trạng thái rà (app)']))).length };
  });
  const loai = {}; P.forEach(x => { const k = x['Dòng hàng'] || '—'; loai[k] = (loai[k] || 0) + 1; });
  $('main').innerHTML = `
    <div class="grid" style="margin-bottom:14px">
      <div class="stat click" data-go="tc"><div class="n">${fmt(L.length)}</div><div class="l">Listing Shopee (${D.shops.length} shop)</div></div>
      <div class="stat"><div class="n">${fmt(plTong)}</div><div class="l">Phân loại</div></div>
      <div class="stat click" data-go="tc"><div class="n">${fmt(D.SKU.length)}</div><div class="l">SKU chuẩn · ${fmt(skuCheck)} cần kiểm tra</div></div>
      <div class="stat click" data-go="web"><div class="n">${fmt(P.length)}</div><div class="l">Trang web dự kiến · ${fmt(ready)} sẵn sàng</div></div>
      <div class="stat"><div class="n">${fmt(D.BT.length)}</div><div class="l">Biến thể web</div></div>
      <div class="stat click" data-go="cho" style="${p.all ? 'border-color:#f2b632' : ''}"><div class="n">${fmt(p.all)}</div><div class="l">Việc chờ duyệt</div></div>
    </div>
    <div class="card"><h2>Theo shop Shopee</h2><div class="scroll"><table>
      <tr><th>Shop</th><th class="num">Listing</th><th class="num">Phân loại</th><th class="num hide-m">Tổng tồn</th><th class="num">Chưa rà</th></tr>
      ${byShop.map(r => `<tr><td>${esc(r.s)}</td><td class="num">${fmt(r.n)}</td><td class="num">${fmt(r.pl)}</td><td class="num hide-m">${fmt(r.ton)}</td><td class="num">${fmt(r.chua)}</td></tr>`).join('')}
    </table></div></div>
    <div class="card"><h2>Web Xfilter.vn (đề xuất, chưa đăng)</h2>
      <div class="row">${Object.keys(loai).map(k => `<span class="tag info">${esc(k)}: ${loai[k]}</span>`).join('')}
      <span class="tag ok">Sẵn sàng: ${ready}</span><span class="tag warn">Cần duyệt: ${P.length - ready}</span>
      <span class="tag ok">Có mô tả: ${Object.keys(D.MT).length}/${P.length}</span>
      <span class="tag warn">Phân loại cần mã: ${D.CAN_MA.length}</span><span class="tag warn">Phân loại chờ duyệt: ${D.CHO.length}</span></div>
    </div>
    <div class="card"><h2>Việc chờ duyệt</h2>
      <div>Câu hỏi chưa trả lời: <b>${p.ch}</b> · Phân loại chờ duyệt: <b>${p.cho}</b> · Phân loại cần mã: <b>${p.ma}</b></div>
      <div class="muted" style="margin-top:6px">Quyết định lưu ở tab QUYET_DINH của Sheet. Claude đọc lại khi dựng đợt sau; app không tự đổi Shopee hay web Xfilter.vn.</div>
    </div>
    <div class="muted">Đọc từ Sheet lúc ${esc(D.luc)}. Dữ liệu Shopee là bản xuất đã nhập vào Sheet; muốn số mới thì xuất lại rồi nhập đè tab.</div>`;
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = () => { VIEW = el.dataset.go; render(); });
}

/* ============ Tra cứu ============ */
let TC = { q: '', shop: '' };
function vTraCuu() {
  $('main').innerHTML = `
    <div class="card">

// Các trường trên form sản phẩm Haravan (WEB_TRANG cột P→U, WEB_BIEN_THE cột H→L)
function haravanCard(p, bt, mw) {
  const uniq = k => [...new Set(bt.map(b => String(b[k] == null ? '' : b[k])))];
  const one = k => { const u = uniq(k); return u.length === 1 ? (u[0] || '(trống)') : u.map(x => x || '(trống)').join(' / '); };
  const row = (k, v) => `<tr><th style="width:38%">${esc(k)}</th><td>${v}</td></tr>`;
  const seoT = p['SEO title'] || (mw && mw['SEO title']) || '', seoD = p['SEO description'] || (mw && mw['SEO description']) || '';
  return `<div class="card"><h2>Trên Haravan (form sản phẩm)</h2><div class="scroll"><table>
    ${row('Thương hiệu', esc(p['Thương hiệu']))}
    ${row('Loại', esc(p['Loại']))}
    ${row('Hiển thị', esc(p['Hiển thị']))}
    ${p['Cách đăng'] ? row('Cách đăng', p['Cách đăng'] === 'Tạo mới' ? 'Tạo mới' : '<b>Sửa đổi trang cũ</b> (mã ' + esc(p['Mã sản phẩm Haravan']) + ', giữ URL)') : ''}
    ${row('Giá bán', 'theo từng biến thể (bảng dưới)')}
    ${row('Giá so sánh', esc(one('Giá so sánh')))}
    ${row('Có quản lý tồn kho', esc(one('Quản lý tồn kho')))}
    ${row('SKU', 'theo từng biến thể (bảng dưới)')}
    ${row('Barcode', esc(one('Barcode')))}
    ${row('Cho phép giao hàng', esc(one('Giao hàng')))}
    ${row('Khối lượng', esc(one('Khối lượng (g)')) + ' g')}
    ${row('SEO – Tiêu đề trang', esc(seoT) + ` <span class="muted">(${seoT.length}/70)</span>`)}
    ${row('SEO – Mô tả trang', esc(seoD) + ` <span class="muted">(${seoD.length}/320)</span>`)}
    ${row('Đường dẫn', p['Đường dẫn'] ? `<span class="muted">${esc(p['Đường dẫn'])}</span>` : '')}
  </table></div><div class="muted" style="margin-top:6px">Mô tả sản phẩm: xem thẻ "Mô tả + SEO" bên dưới. Trang chưa đăng nên đường dẫn chưa mở được.</div></div>`;

// Hiện HTML mô tả trong khung cách ly (sandbox: không chạy script)
async function showMoTa(handle) {

    const m = await call('moTa', TOKEN, handle);

      <div><span class="chip ${WB.loai ? '' : 'on'}" data-loai="">Mọi dòng hàng</span>${loais.map(s => `<span class="chip ${WB.loai === s ? 'on' : ''}" data-loai="${esc(s)}">${esc(s)}</span>`).join('')}</div>

    </div>
    <div class="card" id="wres"></div>`;
  const draw = () => {
    const words = norm(WB.q).split(' ').filter(Boolean);
    const rows = D.TRANG.filter(p => (!WB.st || p['Trạng thái'] === WB.st) && (!WB.loai || p['Dòng hàng'] === WB.loai) && words.every(w => p._k.indexOf(w) >= 0));
    $('wres').innerHTML = `<h2>${rows.length} trang</h2>` + (rows.length ? rows.map(pageItem).join('') : '<div class="muted">Không có trang khớp.</div>');
    bindItems($('wres'));
  };
  $('wq').oninput = () => { WB.q = $('wq').value; clearTimeout(vWeb.h); vWeb.h = setTimeout(draw, 150); };
  document.querySelectorAll('[data-st]').forEach(c => c.onclick = () => { WB.st = c.dataset.st; vWeb(); });
  document.querySelectorAll('[data-loai]').forEach(c => c.onclick = () => { WB.loai = c.dataset.loai; vWeb(); });
  draw();
}

  $('main').innerHTML = `
    <div class="card"><div class="row">
      <span class="chip ${CHO.chiChua ? 'on' : ''}" id="fChua">Chưa quyết (${p.all})</span><span class="chip ${CHO.chiChua ? '' : 'on'}" id="fAll">Tất cả</span>
      <span class="sp" style="flex:1"></span><button class="btn ghost" id="addQ">+ Thêm câu hỏi / việc</button></div>
      <div class="muted" style="margin-top:6px">Bấm lưu là ghi vào tab QUYET_DINH (có giờ, sửa lại được). Claude đọc khi làm đợt sau. Không tự đổi Shopee hay web Xfilter.vn.</div></div>
    <div class="card"><h2>Câu hỏi (${p.ch} chưa trả lời)</h2>
      ${Object.keys(nhom).length ? Object.keys(nhom).map(k => `<h3 style="margin-top:6px">${esc(k)}</h3>` + nhom[k].map(qCard).join('')).join('') : '<div class="muted">Không còn câu nào.</div>'}</div>
    <div class="card"><h2>Phân loại chờ duyệt (${p.cho} chưa quyết)</h2>
      <div class="muted" style="margin-bottom:8px">Có lên web không. Ghi kèm vào cột "Anh quyết" của tab WEB_CHO_ANH_DUYET.</div>
      ${D.CHO.filter(showC).map(choCard).join('') || '<div class="muted">Không còn.</div>'}</div>
    <div class="card"><h2>Phân loại cần mã (${p.ma} chưa có)</h2>
      <div class="muted" style="margin-bottom:8px">Phân loại chưa có SKU dùng được. Anh gõ SKU đúng (hoặc "Bỏ" nếu tổ hợp không tồn tại).</div>
      ${D.CAN_MA.filter(showM).map(maCard).join('') || '<div class="muted">Không còn.</div>'}</div>`;
  $('fChua').onclick = () => { CHO.chiChua = true; vCho(); };
  $('fAll').onclick = () => { CHO.chiChua = false; vCho(); };
  $('addQ').onclick = addQuestion;
  $('main').querySelectorAll('[data-pick]').forEach(c => c.onclick = () => {
    const box = c.closest('.q'); box.querySelector('[name=qd]').value = c.dataset.pick;
    box.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x === c));
  });
  $('main').querySelectorAll('[data-save]').forEach(b => b.onclick = () => save(b));
  $('main').querySelectorAll('[data-list]').forEach(el => el.onclick = e => { e.preventDefault(); openListing(el.dataset.list); });
}
function chips(opts, cur) { return opts.map(o => `<span class="chip ${cur === o ? 'on' : ''}" data-pick="${esc(o)}">${esc(o)}</span>`).join(''); }
function done(d) { return d ? `<div class="muted">Đã lưu: <b>${esc(d.qd)}</b>${d.ghiChu ? ' — ' + esc(d.ghiChu) : ''} · ${esc(d.luc || '')}</div>` : ''; }
function qCard(q) {
  const d = decision('CAU_HOI', q['Mã']) || (q['Trả lời của anh'] ? { qd: q['Trả lời của anh'], ghiChu: q['Ghi chú của anh'], luc: q['Cập nhật lúc'] } : null);
  const opts = String(q['Gợi ý (cách nhau bằng |)'] || '').split('|').map(s => s.trim()).filter(Boolean);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CAU_HOI" data-khoa="${esc(q['Mã'])}" data-mota="${esc(q['Câu hỏi'])}">
    <div class="qt">${esc(q['Câu hỏi'])}</div>
    ${q['Bối cảnh'] ? `<div class="muted">${esc(q['Bối cảnh'])}</div>` : ''}${done(d)}
    <div class="act"><div>${chips(opts, d && d.qd)}</div>
      <input type="text" name="qd" placeholder="Trả lời (chọn gợi ý hoặc gõ)" value="${esc(d ? d.qd : '')}">
      <input type="text" name="gc" placeholder="Ghi chú (không bắt buộc)" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
function choCard(r) {
  const d = decision('CHO_DUYET', r['Mã phân loại']) || (r['Anh quyết'] ? { qd: r['Anh quyết'], ghiChu: r['Ghi chú của anh'] } : null);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CHO_DUYET" data-khoa="${esc(r['Mã phân loại'])}" data-mota="${esc(r['Tên phân loại'])}">
    <div class="qt">${esc(r['Tên phân loại'])} <span class="muted">· SKU ${esc(r['SKU gốc'])} · ${esc(r['Giá'])} · tồn ${esc(r['Tồn'])}</span></div>
    <div class="muted">${esc(r['Lý do'])}</div>
    <div class="muted"><a href="#" data-list="${esc(r['Shopee'])}">${esc(r['Listing Shopee']).slice(0, 90)}</a></div>${done(d)}
    <div class="act"><div>${chips(['Giữ lên web', 'Bỏ'], d && d.qd)}</div>
      <input type="hidden" name="qd" value="${esc(d ? d.qd : '')}">
      <input type="text" name="gc" placeholder="Ghi chú (ví dụ: mã đúng là …)" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
function maCard(r) {
  const d = decision('CAN_MA', r['Mã phân loại']);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CAN_MA" data-khoa="${esc(r['Mã phân loại'])}" data-mota="${esc(r['Tên phân loại'])}">
    <div class="qt">${esc(r['Dòng xe'])} ${esc(r['Đời xe'])} <span class="muted">· ${esc(r['Tên phân loại'])}</span></div>
    <div class="muted">SKU gốc: ${esc(r['SKU gốc'])} · ${esc(r['Giá'])} · tồn ${esc(r['Tồn'])} · <a href="#" data-list="${esc(r['Shopee'])}">${esc(r['Listing Shopee']).slice(0, 70)}</a></div>${done(d)}
    <div class="act"><div class="row"><input type="text" name="qd" placeholder="SKU đúng (vd ETO01) hoặc Bỏ" value="${esc(d ? d.qd : '')}" style="flex:1">
      <span class="chip" data-pick="Bỏ">Bỏ</span></div>
      <input type="text" name="gc" placeholder="Ghi chú" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
async function save(btn) {
  const box = btn.closest('.q');
  const d = { loai: box.dataset.loai, khoa: box.dataset.khoa, moTa: box.dataset.mota,
    qd: box.querySelector('[name=qd]').value.trim(), ghiChu: box.querySelector('[name=gc]').value.trim() };
  if (!d.qd) { toast('Chưa chọn / nhập quyết định.'); return; }
  btn.disabled = true; btn.textContent = 'Đang lưu…';
  try {
    const r = await call('luuQuyetDinh', TOKEN, d);
    D.qd[d.loai + '|' + d.khoa] = { qd: r.qd, ghiChu: r.ghiChu, luc: r.luc };
    toast('Đã lưu vào Sheet.');
    render();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Lưu'; }
}
function addQuestion() {
  openPanel('Thêm câu hỏi / việc cần nhớ', `<div class="card">
    <input id="nqNhom" type="text" placeholder="Nhóm (vd: Nội dung, Ảnh, Dữ liệu web)" style="width:100%;margin-bottom:8px">
    <textarea id="nqCau" placeholder="Câu hỏi / việc cần quyết"></textarea>
    <textarea id="nqBc" placeholder="Bối cảnh (không bắt buộc)" style="margin-top:8px"></textarea>
    <input id="nqGy" type="text" placeholder="Gợi ý trả lời, cách nhau bằng | (vd: Có|Không)" style="width:100%;margin:8px 0">
    <div class="err" id="nqErr"></div><button class="btn" id="nqBtn">Thêm</button></div>`);
  $('nqBtn').onclick = async () => {
    try {
      await call('themCauHoi', TOKEN, { nhom: $('nqNhom').value, cauHoi: $('nqCau').value, boiCanh: $('nqBc').value, goiY: $('nqGy').value });
      closePanel(); toast('Đã thêm.'); VIEW = 'cho'; start();
    } catch (e) { $('nqErr').textContent = e.message; }
  };
}

/* ============ Vào app ============ */
if (TOKEN) start(); else showLogin();
</script>
</body>
</html>
