<!DOCTYPE html>
<html lang="vi">
<head>

<script>
// Thay google.script.run: gọi server Master Listing (POST JSON, token trong header Authorization; không dùng cookie)
(function () {
  const API = 'https://listing-api.xfilter.com.vn';
  window.ML_API = API;   // ảnh listing: link ký do server trả là đường dẫn tương đối (Note 37)
  const RIENG = { trangThaiMatKhau: a => ['/api/trang-thai', {}, ''],
    taoTaiKhoanDau: a => ['/api/tao-tai-khoan-dau', { ten: a[0], mat_khau: a[1], ma: a[2] }, ''],
    login: a => ['/api/dang-nhap', { ten: a[0], mat_khau: a[1] }, ''],
    logout: a => ['/api/dang-xuat', {}, a[0]],
    doiMatKhau: a => ['/api/doi-mat-khau', { cu: a[1], moi: a[2] }, a[0]] };
  function goi(fn, args) {
    const [path, body, token] = RIENG[fn] ? RIENG[fn](args) : ['/api', { fn, args }, args[0]];
    const h = { 'Content-Type': 'application/json' };
    if (token) h.Authorization = 'Bearer ' + token;
    return fetch(API + path, { method: 'POST', credentials: 'omit', headers: h, body: JSON.stringify(body) })
      .then(r => { if (!r.ok) throw new Error('Máy chủ trả lỗi ' + r.status); return r.json(); });
  }
  function mk(ok, bad) {
    return new Proxy({}, { get(_, fn) {
      if (fn === 'withSuccessHandler') return f => mk(f, bad);
      if (fn === 'withFailureHandler') return f => mk(ok, f);
      return (...args) => goi(fn, args).then(j => j.ok ? ok && ok(j.res) : bad && bad(new Error(j.err)),
        e => bad && bad(new Error('Không kết nối được máy chủ Master Listing (' + e.message + '). Máy Mac mini có đang bật không?')));
    } });
  }
  window.google = { script: { run: mk() } };
})();
</script>

<style>
  :root {
    --brand: #12355b; --brand-2: #1f5a8f; --bg: #eef2f6; --card: #fff; --ink: #1b2430; --muted: #66707c;
    --line: #dde3ea; --ok: #1e7f4f; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fff3d6; --bad: #a12a2a; --bad-bg: #fde8e8;
    --chip: #eef3f9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand-2); }
  .hidden { display: none !important; }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .top b { letter-spacing: .06em; font-size: 15px; }
  .top .sp { flex: 1; }
  .top button { background: rgba(255,255,255,.12); border: 0; color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  nav { display: flex; gap: 2px; padding: 0 8px; overflow-x: auto; }
  nav button { background: none; border: 0; color: rgba(255,255,255,.75); padding: 10px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.on { color: #fff; border-bottom-color: #f2b632; font-weight: 600; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: #f2b632; color: #222; font-size: 12px; font-weight: 700; text-align: center; margin-left: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.click { cursor: pointer; }
  .stat.click:hover { border-color: var(--brand-2); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password], input[type=search], select, textarea {
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: #fff; min-width: 0; }
  textarea { width: 100%; min-height: 54px; resize: vertical; }
  .search { flex: 1; min-width: 200px; font-size: 16px; }
  .btn { border: 1px solid var(--brand-2); background: var(--brand-2); color: #fff; padding: 8px 14px; border-radius: 9px; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--brand-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .chip { display: inline-block; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; margin: 2px 4px 2px 0; }
  .chip.on { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
  .tag { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.info { background: var(--chip); color: var(--brand); }
  .anh-luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .anh-o { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f4f6f8; cursor: pointer; }
  .anh-o img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
  .anh-o .video { display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; font-size: 30px; color: var(--brand); }
  .anh-o .ten { font-size: 11px; padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--card); }
  .anh-o .nhan { position: absolute; top: 4px; left: 4px; }
  #anhXem { position: fixed; inset: 0; background: rgba(10, 20, 30, .88); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  #anhXem img { max-width: 100%; max-height: calc(100% - 70px); border-radius: 8px; background: #fff; }
  #anhXem .thanh { color: #fff; margin-top: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 14px; }
  #anhXem a { color: #fff; }
  #anhXem .btn.ghost { background: rgba(255, 255, 255, .14); color: #fff; border: 1px solid rgba(255, 255, 255, .55); }
  #anhXem .btn.ghost:disabled { opacity: .35; cursor: default; }
  .anh-o { padding: 0; font: inherit; text-align: left; width: 100%; }
  .anh-o:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }
  .anh-nhom { font-size: 13px; font-weight: 700; margin: 10px 0 6px; color: var(--muted); }
  .item { padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: #f7f9fc; }
  .item:last-child { border-bottom: 0; }
  .item .t { font-weight: 600; }
  .links a { font-size: 13px; margin-right: 10px; white-space: nowrap; }
  .sku { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
  .ws { white-space: pre-wrap; }
  /* Bảng chi tiết bật lên */
  .ov { position: fixed; inset: 0; background: rgba(10,20,35,.45); z-index: 20; display: flex; justify-content: flex-end; }
  .panel { background: var(--bg); width: min(760px, 100%); height: 100%; overflow-y: auto; padding: 0 0 30px; }
  .panel .ph { position: sticky; top: 0; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; gap: 10px; align-items: center; z-index: 2; }
  .panel .ph .t { flex: 1; font-weight: 700; }
  .panel .ph button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .panel .pb { padding: 14px 16px; }
  /* Đăng nhập */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--brand); }
  .login .box { background: #fff; border-radius: 16px; padding: 24px; width: min(360px, 100%); }
  .login input { width: 100%; margin: 6px 0 10px; font-size: 16px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b2430; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 50; font-size: 14px; max-width: 90vw; }
  .loading { padding: 30px; text-align: center; color: var(--muted); }
  .q { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .q.done { border-left: 4px solid var(--ok); }
  .q.todo { border-left: 4px solid #f2b632; }
  .q .qt { font-weight: 600; margin-bottom: 4px; }
  .q .act { margin-top: 8px; display: grid; gap: 6px; }
  @media (max-width: 640px) {
    main { padding: 12px; }
    .hide-m { display: none; }
    th, td { padding: 6px 5px; }
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="box">
    <div style="font-weight:800;letter-spacing:.12em;color:var(--brand)">MASTER LISTING</div>
    <div class="muted" style="margin-bottom:14px">XFILTER · SKU và listing đa kênh</div>
    <input id="ten" type="text" placeholder="Tên đăng nhập" autocomplete="username">
    <div id="loginNew" class="hidden">
      <div class="muted">Lần đầu mở app: tạo tài khoản Admin (mật khẩu 8–64 ký tự). Mã khởi tạo nằm trong file <b>MASTER_LISTING/du_lieu/MA_KHOI_TAO.txt</b> trên Mac mini.</div>
      <input id="maKt" type="text" placeholder="Mã khởi tạo (vd ABCD-1234-EF56)" autocomplete="off">

<div id="app" class="hidden">
  <header>
    <div class="top">
      <b>MASTER LISTING</b><span class="sp"></span>
      <button id="reloadBtn" title="Đọc lại dữ liệu từ máy chủ Master Listing">↻ Tải lại</button>

</div>

<div id="ov" class="ov hidden"><div class="panel"><div class="ph"><span class="t" id="pT"></span><button id="pClose">Đóng</button></div><div class="pb" id="pB"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ============ Tiện ích ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim();
const flat = s => norm(s).replace(/[\s\-_.\/]/g, '');
const fmt = n => Number(n || 0).toLocaleString('vi-VN');
const num = s => Number(String(s == null ? '' : s).replace(/[^\d\-]/g, '')) || 0;
// Giá (anh Trung 05/10/2026, sửa lỗi 450.000 → 450 / NaN): nhận số hoặc chuỗi nghìn "1.068.000"; trống/sai → null, hiện "—" chứ không hiện 0
const docGia = v => {
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v) : null;
  const s = String(v == null ? '' : v).trim().replace(/\s*(₫|đ|vnd)$/i, '');
  if (/^\d+$/.test(s) || /^\d{1,3}([.,]\d{3})+$/.test(s)) return Number(s.replace(/[.,]/g, ''));
  return null;
};
const gia = v => { const n = docGia(v); return n == null ? '—' : n.toLocaleString('vi-VN') + ' ₫'; };
const khoangGia = (a, b) => {
  const x = docGia(a), y = docGia(b);
  if (x == null && y == null) return '—';
  if (x == null || y == null || x === y) return gia(x == null ? y : x);
  return x.toLocaleString('vi-VN') + '–' + gia(y);
};
// Ảnh listing (Note 37): link ảnh do server ký, gắn địa chỉ API của bản web
const anhUrl = u => u ? (window.ML_API || '') + u : '';
const anhTag = ma => { const d = D && D.anhDem && D.anhDem[ma]; if (!d) return '';
  return `<span class="tag ok" title="Ảnh / video trong kho Drive">Ảnh ${d[0]}${d[1] ? ' · video ' + d[1] : ''}</span>${d[2] ? ` <span class="tag warn">nháp ${d[2]}</span>` : ''}`; };
function cardAnh(ma) {
  return ma ? `<div class="card"><h2>Ảnh & video <span class="muted" style="font-weight:400;font-size:13px">${esc(ma)}</span></h2><div id="anhBox" data-ma="${esc(ma)}"><div class="loading">Đang đọc…</div></div></div>` : '';
}
// Ảnh listing (Note 37, sửa theo review Codex 06/10): nhóm Đã duyệt / Nháp, bìa = file <MÃ>_01, ảnh biến thể hiện SKU,
// ô ảnh là nút (bàn phím được), xem lớn chỉ đi qua ẢNH (video mở Drive riêng), Esc chỉ đóng lớp xem ảnh.
async function napAnh(ma) {
  const box = () => { const b = $('anhBox'); return b && b.dataset.ma === ma ? b : null; };
  if (!ma || !box()) return;
  try {
    const r = await call('anhListing', TOKEN, ma);
    const b = box(); if (!b) return;
    const moDrive = r.moDrive ? `<a class="btn ghost" href="${esc(r.moDrive)}" target="_blank" rel="noopener noreferrer">${r.moDriveLaGoc ? 'Mở kho chung ↗' : 'Mở thư mục trên Drive ↗'}</a>
      ${r.moDriveLaGoc ? `<div class="muted" style="margin-top:4px">Thư mục của mã này chưa có link Drive — trong kho chung tìm thư mục bắt đầu bằng <b>${esc(ma)}_</b>${r.thuMuc ? ' (' + esc(r.thuMuc) + ')' : ''}. Không để ảnh ở gốc kho.</div>` : ''}` : '';
    const chan = `<div class="muted" style="margin-top:8px">Kho: Drive xfiltertool / MASTER_LISTING${r.thuMuc ? ' / ' + esc(r.thuMuc) : ''}${r.capNhat ? ' · ảnh đồng bộ lúc ' + esc(r.capNhat.replace('T', ' ').slice(0, 16)) : ''}.
      Ảnh mới: để vào thư mục của mã (bản chưa duyệt để trong <b>_nhap</b>), rồi chạy <b>DONG_BO_ANH.command</b>. Ảnh trong kho chưa có nghĩa là đã đăng lên sàn/web.</div>`;
    if (!r.tep || !r.tep.length) { b.innerHTML = `<div class="muted">Chưa có ảnh / video cho mã này.</div><div style="margin-top:8px">${moDrive}</div>${chan}`; return; }
    const anh = r.tep.filter(t => t.loai === 'anh' && t.vua);      // xem lớn chỉ đi qua ảnh xem được
    const o = (t) => { const i = r.tep.indexOf(t);
      const nhan = [t.bia ? '<span class="tag info">bìa</span>' : '', t.sku ? `<span class="tag info">SKU ${esc(t.sku)}</span>` : '',
                    t.loai === 'video' ? '<span class="tag info">video</span>' : '', t.nhap ? '<span class="tag warn">nháp</span>' : '',
                    t.loi ? '<span class="tag bad">lỗi</span>' : ''].join(' ');
      return `<button type="button" class="anh-o" data-i="${i}" title="${esc(t.ten)} · ${t.kb} KB${t.loi ? ' · ' + esc(t.loi) : ''}">
        ${t.nho ? `<img loading="lazy" alt="${esc(t.ten)}" src="${esc(anhUrl(t.nho))}" referrerpolicy="no-referrer">` : `<div class="video">${t.loai === 'video' ? '▶' : '!'}</div>`}
        <div class="nhan">${nhan}</div><div class="ten">${esc(t.ten)}</div></button>`; };
    const duyet = r.tep.filter(t => !t.nhap), nhap = r.tep.filter(t => t.nhap);
    b.innerHTML = (r.coBia ? '' : '<div style="margin-bottom:6px"><span class="tag warn">Chưa có ảnh bìa (file ' + esc(ma) + '_01)</span></div>') +
      (duyet.length ? `<div class="anh-nhom">Đã duyệt (${duyet.length})</div><div class="anh-luoi">${duyet.map(o).join('')}</div>` : '') +
      (nhap.length ? `<div class="anh-nhom">Nháp — chờ anh duyệt (${nhap.length})</div><div class="anh-luoi">${nhap.map(o).join('')}</div>` : '') +
      `<div style="margin-top:10px">${moDrive}</div>${chan}`;
    b.querySelectorAll('.anh-o').forEach(el => el.onclick = () => {
      const t = r.tep[+el.dataset.i];
      if (t.loai === 'video') { if (t.drive) window.open(t.drive, '_blank', 'noopener,noreferrer'); else toast('Video chưa có link Drive — chờ Drive đồng bộ lên mây rồi chạy lại đồng bộ ảnh.'); return; }
      if (!t.vua) { toast(t.loi || 'Không đọc được ảnh này — kiểm file trong kho.'); return; }
      xemAnh(anh, anh.indexOf(t), el);
    });
  } catch (e) { const b = box(); if (b) b.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}
function xemAnh(ds, i, quay) {
  const t = ds[i];
  if (!t || !t.vua) return;
  let o = $('anhXem'); if (o) o.remove();
  o = document.createElement('div'); o.id = 'anhXem'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
  o.innerHTML = `<img alt="${esc(t.ten)}" src="${esc(anhUrl(t.vua))}" referrerpolicy="no-referrer"><div class="thanh">
    <button class="btn ghost" data-b="-1" ${i === 0 ? 'disabled' : ''}>‹ Trước</button><span>${esc(t.ten)}${t.sku ? ' · SKU ' + esc(t.sku) : ''}${t.nhap ? ' · nháp' : ''} · ${i + 1}/${ds.length}</span>
    <button class="btn ghost" data-b="1" ${i === ds.length - 1 ? 'disabled' : ''}>Sau ›</button>${t.drive ? `<a href="${esc(t.drive)}" target="_blank" rel="noopener noreferrer">Mở trên Drive ↗</a>` : ''}<button class="btn ghost" data-b="0">Đóng</button></div>`;
  document.body.appendChild(o);
  const dong = () => { o.remove(); document.removeEventListener('keydown', phim, true); if (quay && quay.focus) quay.focus(); };
  const di = d => { const k = i + d; if (k >= 0 && k < ds.length) { document.removeEventListener('keydown', phim, true); xemAnh(ds, k, quay); } };
  function phim(e) {
    if (!document.body.contains(o)) { document.removeEventListener('keydown', phim, true); return; }
    if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); dong(); }   // chỉ đóng lớp xem ảnh, giữ khung listing
    else if (e.key === 'ArrowLeft') di(-1);
    else if (e.key === 'ArrowRight') di(1);
  }
  document.addEventListener('keydown', phim, true);
  o.onclick = e => { const b = e.target.closest('[data-b]'); if (b) { const d = +b.dataset.b; d ? di(d) : dong(); } else if (e.target === o) dong(); };
  const nut = o.querySelector('[data-b="0"]'); if (nut) nut.focus();
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 3500); }

function prep() {

  D.CAN_MA = objs(D.canMa); D.CHO = objs(D.cho); D.MOTA = objs(D.mota); D.CH = objs(D.cauHoi);
  D.MT = {}; objs(D.moTaWeb).forEach(m => D.MT[m['URL (handle)']] = m);

function shopUrl(shop, id) { const s = D.shopIds[shop]; return s && id ? 'https://shopee.vn/product/' + s + '/' + id : ''; }
function editUrl(id) { return id ? 'https://banhang.shopee.vn/portal/product/' + id : ''; }

function statusTag(s) {

        SKU = tấm lọc vật lý của 3 shop Lọc Khí Xanh (LKX), Màng Lọc Xanh (MLX), HepaHN, gom từ phân loại Shopee, chỉ chuẩn hoá cách viết (0509COMBO → 0509 COMBO, BU AM → BÙ ẨM, 305 X 265 X 35 → 305-265-35), không gộp model khác nhau, không gộp theo mã kho app Báo cáo.
        Model, kích thước, giá lấy từ file kinh doanh khi dòng file đã ghép được; thương hiệu ghi "suy từ tên listing / đoán theo mã" là CHƯA xác nhận.
        Dòng "Chờ xác nhận" có nhiều ứng viên như nhau — app không tự chọn. Sửa ở file gốc rồi chạy cập nhật; không sửa ở đây.</div></details>`;
  } else {
    const can = [...SK.dieuHoa.map(o => Object.assign({ _loai: 'Điều hoà' }, o)), ...SK.dongCo.map(o => Object.assign({ _loai: 'Động cơ' }, o))].filter(o => o['Cần kiểm tra']);
    subs = [['th', 'Tổng hợp (' + SK.tongHop.length + ')'], ['dh', 'Lọc điều hoà (' + SK.dieuHoa.length + ')'], ['dc', 'Lọc động cơ (' + SK.dongCo.length + ')'], ['ck', 'Cần kiểm tra (' + can.length + ')']];
    cols = { th: ['SKU chuẩn', 'Loại', 'Kích thước', 'Số dòng xe', 'Hãng xe', 'Mã listing web', 'Bản trên Shopee', 'Số listing Shopee', 'Ghi chú'],
             dh: ['SKU chuẩn', 'Hãng xe', 'Dòng xe', 'Đời xe', 'Kích thước Xfilter', 'Mã OEM (theo hãng)', 'Cần kiểm tra'],
             dc: ['SKU chuẩn', 'Hãng xe', 'Dòng xe', 'Động cơ', 'Đời xe', 'Kích thước', 'Mã cũ (cột E)', 'Cần kiểm tra'],
             ck: ['_loai', 'SKU chuẩn', 'Hãng xe', 'Dòng xe', 'Đời xe', 'Cần kiểm tra'] }[SK.sub.OTO];
    src = { th: SK.tongHop, dh: SK.dieuHoa, dc: SK.dongCo, ck: can }[SK.sub.OTO];
    ghi = '<div class="muted" style="margin-top:6px">Từ file quản lý SKU (XFILTER2.numbers) đã chuẩn hoá: SKU ngắn, hãng, đời, kích thước cùng một kiểu. Sửa ở file gốc rồi chạy cập nhật; không sửa ở đây.</div>';
  }
  const subNow = SK.sub[SK.cum];
  $('main').innerHTML = `
    <div class="card" style="padding-bottom:8px">${cumChips}
      <div class="row" style="gap:4px;margin-top:8px">${subs.map(([k, t]) => `<span class="chip ${subNow === k ? 'on' : ''}" data-sksub="${k}">${esc(t)}</span>`).join('')}</div>
      <div class="row" style="margin-top:8px"><input id="skq" class="search" type="search" placeholder="${SK.cum === 'MLKK' ? 'Tìm SKU, hãng máy, model, kích thước…' : 'Tìm SKU, mã OEM, xe, kích thước…'}" value="${esc(SK.q[SK.cum] || '')}"></div>
      ${ghi}</div>
    <div class="card" id="skres"></div>`;
  bindCum();
  document.querySelectorAll('[data-sksub]').forEach(c => c.onclick = () => { SK.sub[SK.cum] = c.dataset.sksub; SK.n = 150; vSku(); });
  const draw = () => {
    const words = norm(SK.q[SK.cum] || '').split(' ').filter(Boolean);
    const rows = src.filter(o => words.every(w => (o._k || '').indexOf(w) >= 0));
    const cell = (o, c) => {
      const v = String(o[c] == null ? '' : o[c]);
      if (c === 'SKU chuẩn') return v ? `<span class="sku" data-sku="${esc(v)}" style="cursor:pointer">${esc(v)}</span>` : '<span class="muted">chưa ghép</span>';
      if (c === 'Cần kiểm tra' || c === 'Ghi chú') return v ? `<span class="tag warn" style="white-space:normal;display:inline">${esc(v)}</span>` : '';
      if (c === 'Ứng viên') {
        // Anh chọn SKU ngay tại đây (Note 38 đợt 2): lưu QUYET_DINH loại MLKK_SKU theo "Mã dòng" (nội dung dòng, không theo STT)
        const md = o['Mã dòng'], q = md ? decision('MLKK_SKU', md) : null, ap = String(o['Cách ghép'] || '').startsWith('Anh');
        const nut = (x, nhan) => md ? ` <button type="button" class="btn ghost" data-sku-chon="${esc(x)}" data-md="${esc(md)}" data-stt="${esc(o['STT gốc'])}" style="padding:1px 7px;font-size:12px;margin:2px 6px 2px 0">${esc(nhan)}</button>` : '';
        const ds = v ? v.split(', ').map(x => `<span class="sku" data-sku="${esc(x)}" style="cursor:pointer">${esc(x)}</span>${nut(x, 'Chọn')}`).join('') : '';
        const da = q && !ap ? `<div><span class="tag info" style="white-space:normal">Anh đã chọn: ${esc(q.qd)} — áp ở lần cập nhật dữ liệu sau</span></div>` : '';
        return ds + (v ? nut('KHÔNG CÓ', 'Không có SKU đúng') : '') + da;
      }
      if (c === 'Thương hiệu' && o['Nguồn thương hiệu'] && o['Nguồn thương hiệu'] !== 'File KD') return esc(v) + (v ? ' <span class="muted">(suy)</span>' : '');
      return esc(v.length > 120 ? v.slice(0, 120) + '…' : v);
    };
    $('skres').innerHTML = `<h2>${rows.length} dòng</h2><div class="scroll"><table><tr>${cols.map(c => `<th>${esc(c === '_loai' ? 'Bảng' : c)}</th>`).join('')}</tr>
      ${rows.slice(0, SK.n).map(o => `<tr>${cols.map(c => `<td>${cell(o, c)}</td>`).join('')}</tr>`).join('')}</table></div>` +
      (rows.length > SK.n ? `<div style="margin-top:10px"><button class="btn ghost" id="skMore">Xem thêm (${rows.length - SK.n})</button></div>` : '');
    $('skres').querySelectorAll('[data-sku]').forEach(el => el.onclick = () => openSku(el.dataset.sku));
    $('skres').querySelectorAll('[data-sku-chon]').forEach(el => el.onclick = async e => {
      e.stopPropagation();
      const sku = el.dataset.skuChon, md = el.dataset.md;
      if (!confirm(sku === 'KHÔNG CÓ' ? 'Xác nhận dòng STT ' + el.dataset.stt + ' chưa có SKU Shopee nào đúng?' : 'Chọn SKU ' + sku + ' cho dòng STT ' + el.dataset.stt + '?')) return;
      el.disabled = true;
      try {
        const r = await call('luuQuyetDinh', TOKEN, { loai: 'MLKK_SKU', khoa: md, qd: sku, moTa: 'STT ' + el.dataset.stt });
        D.qd['MLKK_SKU|' + md] = { qd: r.qd, ghiChu: r.ghiChu, luc: r.luc };
        toast('Đã lưu lựa chọn. Áp vào bảng ở lần cập nhật dữ liệu sau (nhắn Claude hoặc chạy cap_nhat).');
        draw();
      } catch (err) { toast(err.message); el.disabled = false; }
    });
    const m = $('skMore'); if (m) m.onclick = () => { SK.n += 300; draw(); };
  };
  $('skq').oninput = () => { SK.q[SK.cum] = $('skq').value; SK.n = 150; clearTimeout(vSku.h); vSku.h = setTimeout(draw, 150); };
  draw();
}

/* ============ Shopee: cụm shop (Phụ kiện MLKK / robot / ô tô) → shop; Tổng quan; Theo SKU ============ */
let SP = { sub: 'tq', shop: '', dong: '', q: '', n: 100 };
function spCum() {
  // cụm theo mã shop (du_lieu/nhom_shop.json) → tên shop trong dữ liệu
  const ten = Object.fromEntries(Object.entries(D.shopMa || {}).map(([t, m]) => [m, t]));
  const cum = (D.nhomShop || []).map(c => ({ ma: c.ma, ten: c.ten, ghiChu: c.ghi_chu || '', shops: (c.shopee || []).map(m => ten[m]).filter(Boolean) }));
  const co = new Set(cum.flatMap(c => c.shops));
  const le = D.shops.filter(s => !co.has(s));
  if (le.length) cum.push({ ma: 'KHAC', ten: 'Shop khác', ghiChu: '', shops: le });
  return cum;
}
function vShopee() {
  const shopMa = D.shopMa || {};
  const cnt = ss => D.LIST.filter(l => ss.includes(l['Shop'])).length;
  const cums = spCum();
  const cur = cums.find(c => c.ma === SP.sub);
  const subs = [['tq', 'Tổng quan']].concat(cums.map(c => [c.ma, c.ten + ' (' + cnt(c.shops) + ')'])).concat([['sku', 'Theo SKU (' + D.SKU.length + ')']]);
  $('main').innerHTML = `
    <div class="card" style="padding-bottom:8px"><div class="row" style="gap:4px">${subs.map(([k, t]) => `<span class="chip ${SP.sub === k ? 'on' : ''}" data-spsub="${esc(k)}">${esc(t)}</span>`).join('')}</div>
      ${cur && cur.shops.length > 1 ? `<div class="row" style="gap:4px;margin-top:6px"><span class="chip ${SP.shop ? '' : 'on'}" data-spshop="">Cả cụm</span>${cur.shops.map(s => `<span class="chip ${SP.shop === s ? 'on' : ''}" data-spshop="${esc(s)}">${esc(s)}${shopMa[s] ? ' · ' + esc(shopMa[s]) : ''} (${cnt([s])})</span>`).join('')}</div>` : ''}
      <div class="muted" style="margin-top:6px">Dữ liệu Shopee: ${esc(nhanShopee())}. Mã listing Shopee = mã shop + số (vd LKX-0001), cấp một lần, không đổi.</div></div>
    <div id="spbody"></div>`;
  document.querySelectorAll('[data-spsub]').forEach(c => c.onclick = () => { SP.sub = c.dataset.spsub; SP.shop = ''; SP.dong = ''; SP.q = ''; SP.n = 100; vShopee(); });
  document.querySelectorAll('[data-spshop]').forEach(c => c.onclick = () => { SP.shop = c.dataset.spshop; SP.dong = ''; SP.n = 100; vShopee(); });
  if (SP.sub === 'tq') return spTongQuan(cums);
  if (SP.sub === 'sku') return spTheoSku();
  if (!cur) { SP.sub = 'tq'; return vShopee(); }
  if (!cur.shops.length) {
    $('spbody').innerHTML = `<div class="card"><h2>${esc(cur.ten)}</h2><div class="muted">Chưa có shop trong cụm này.${cur.ghiChu ? ' ' + esc(cur.ghiChu) + '.' : ''}</div></div>`;
    return;
  }
  spShop(SP.shop ? [SP.shop] : cur.shops);
}
function spTongQuan(cums) {
  const shopMa = D.shopMa || {};
  const dongs = [...new Set(D.LIST.map(l => l['Dòng hàng']).filter(Boolean))];
  const tinh = ss => { const ls = D.LIST.filter(l => ss.includes(l['Shop']));
    return { n: ls.length, pl: ls.reduce((a, l) => a + num(l['Số phân loại']), 0), ton: ls.reduce((a, l) => a + num(l['Tổng tồn']), 0),
      d: Object.fromEntries(dongs.map(g => [g, ls.filter(l => l['Dòng hàng'] === g).length])) }; };
  const dong = (nhan, r, dam) => `<tr${dam ? ' style="background:var(--chip);font-weight:600"' : ''}><td>${nhan}</td><td class="num">${fmt(r.n)}</td><td class="num">${fmt(r.pl)}</td><td class="num hide-m">${fmt(r.ton)}</td>${dongs.map(g => `<td class="num hide-m">${r.d[g] ? fmt(r.d[g]) : '—'}</td>`).join('')}</tr>`;
  $('spbody').innerHTML = `<div class="card"><h2>Theo cụm và shop</h2><div class="scroll"><table>
    <tr><th>Cụm / shop</th><th class="num">Listing</th><th class="num">Phân loại</th><th class="num hide-m">Tổng tồn</th>${dongs.map(g => `<th class="num hide-m">${esc(g)}</th>`).join('')}</tr>
    ${cums.map(c => dong(`<a href="#" data-spgo="${esc(c.ma)}|">${esc(c.ten)}</a>`, tinh(c.shops), true) +
      (c.shops.length ? c.shops.map(s => dong(`&nbsp;&nbsp;<a href="#" data-spgo="${esc(c.ma)}|${esc(s)}">${esc(s)}</a> <span class="sku">${esc(shopMa[s] || '')}</span>`, tinh([s]))).join('')
        : `<tr><td colspan="${4 + dongs.length}" class="muted">&nbsp;&nbsp;Chưa có shop${c.ghiChu ? ' — ' + esc(c.ghiChu) : ''}</td></tr>`)).join('')}
  </table></div></div>`;
  document.querySelectorAll('[data-spgo]').forEach(a => a.onclick = e => { e.preventDefault(); const [c, s] = a.dataset.spgo.split('|'); SP.sub = c; SP.shop = s; vShopee(); });
}
function spShop(shops) {
  const ls = D.LIST.filter(l => shops.includes(l['Shop']));
  const dongs = [...new Set(ls.map(l => l['Dòng hàng']).filter(Boolean))];
  $('spbody').innerHTML = `<div class="card">
      <div class="row"><input id="spq" class="search" type="search" placeholder="Lọc: mã listing, tên, SKU" value="${esc(SP.q)}"></div>
      <div style="margin-top:8px"><span class="chip ${SP.dong ? '' : 'on'}" data-spdong="">Mọi dòng hàng</span>${dongs.map(g => `<span class="chip ${SP.dong === g ? 'on' : ''}" data-spdong="${esc(g)}">${esc(g)} (${ls.filter(l => l['Dòng hàng'] === g).length})</span>`).join('')}</div>
    </div><div class="card" id="spres"></div>`;
  const draw = () => {
    const words = norm(SP.q).split(' ').filter(Boolean);
    const rows = ls.filter(l => (!SP.dong || l['Dòng hàng'] === SP.dong) && words.every(w => l._k.indexOf(w) >= 0));
    $('spres').innerHTML = `<h2>${rows.length} listing</h2>` + (rows.length ? rows.slice(0, SP.n).map(listItem).join('') : '<div class="muted">Không có listing khớp.</div>') +
      (rows.length > SP.n ? `<div style="margin-top:10px"><button class="btn ghost" id="spMore">Xem thêm (${rows.length - SP.n} listing)</button></div>` : '');
    bindItems($('spres'));
    const m = $('spMore'); if (m) m.onclick = () => { SP.n += 200; draw(); };
  };
  $('spq').oninput = () => { SP.q = $('spq').value; SP.n = 100; clearTimeout(spShop.h); spShop.h = setTimeout(draw, 150); };
  document.querySelectorAll('[data-spdong]').forEach(c => c.onclick = () => { SP.dong = c.dataset.spdong; SP.n = 100; spShop(shops); });
  draw();
}
function spTheoSku() {
  const cols = Object.keys(D.SKU[0] || {}).filter(k => /^Listing ở /.test(k));
  $('spbody').innerHTML = `<div class="card"><div class="row"><input id="spq" class="search" type="search" placeholder="Lọc SKU (TO01, ETO01, CF8116…)" value="${esc(SP.q)}"></div></div><div class="card" id="spres"></div>`;
  const draw = () => {
    const qf = flat(SP.q);
    const rows = D.SKU.filter(x => !qf || x._k.indexOf(qf) >= 0);
    $('spres').innerHTML = `<h2>${rows.length} SKU</h2><div class="scroll"><table><tr><th>SKU</th><th>Dòng hàng</th>${cols.map(c => `<th class="num hide-m">${esc(c.replace('Listing ở ', ''))}</th>`).join('')}<th class="num">Listing</th><th class="num">Giá (₫)</th></tr>
      ${rows.slice(0, SP.n).map(x => `<tr><td><span class="sku" data-sku="${esc(x['SKU chuẩn'])}" style="cursor:pointer">${esc(x['SKU chuẩn'])}</span> ${statusTag(x['Trạng thái'])}</td><td>${esc(x['Dòng hàng'])}</td>${cols.map(c => `<td class="num hide-m">${esc(x[c] || '—')}</td>`).join('')}<td class="num">${esc(x['Tổng listing'])}</td><td class="num" style="white-space:normal;min-width:84px">${khoangGia(x['Giá thấp nhất'], x['Giá cao nhất'])}</td></tr>`).join('')}</table></div>` +
      (rows.length > SP.n ? `<div style="margin-top:10px"><button class="btn ghost" id="spMore">Xem thêm (${rows.length - SP.n})</button></div>` : '');
    $('spres').querySelectorAll('[data-sku]').forEach(el => el.onclick = () => openSku(el.dataset.sku));
    const m = $('spMore'); if (m) m.onclick = () => { SP.n += 200; draw(); };
  };
  $('spq').oninput = () => { SP.q = $('spq').value; SP.n = 100; clearTimeout(spTheoSku.h); spTheoSku.h = setTimeout(draw, 150); };
  draw();
}

/* ============ Web Xfilter.vn (nền Haravan) ============ */
let WB = { st: '', loai: '', q: '' };
function vWeb() {
  const loais = [...new Set(D.TRANG.map(p => p['Dòng hàng']).filter(Boolean))];
  const sts = [...new Set(D.TRANG.map(p => p['Trạng thái']).filter(Boolean))];
  $('main').innerHTML = `
    <div class="card">
      <div class="row"><input id="wq" class="search" type="search" placeholder="Tìm mã listing (DH0042) / hãng / dòng xe / SKU" value="${esc(WB.q)}"></div>
      <div style="margin-top:8px"><span class="chip ${WB.st ? '' : 'on'}" data-st="">Mọi trạng thái</span>${sts.map(s => `<span class="chip ${WB.st === s ? 'on' : ''}" data-st="${esc(s)}">${esc(s)}</span>`).join('')}</div>
      <div><span class="chip ${WB.loai ? '' : 'on'}" data-loai="">Mọi dòng hàng</span>${loais.map(s => `<span class="chip ${WB.loai === s ? 'on' : ''}" data-loai="${esc(s)}">${esc(s)}</span>`).join('')}</div>
      <div class="muted" style="margin-top:6px">Bản đề xuất từ shop xfilter (1 trang = 1 dòng xe). Chưa đăng lên web Xfilter.vn.</div>
    </div>
    <div class="card" id="wres"></div>`;
  const draw = () => {
    const words = norm(WB.q).split(' ').filter(Boolean);
    const rows = D.TRANG.filter(p => (!WB.st || p['Trạng thái'] === WB.st) && (!WB.loai || p['Dòng hàng'] === WB.loai) && words.every(w => p._k.indexOf(w) >= 0));
    $('wres').innerHTML = `<h2>${rows.length} trang</h2>` + (rows.length ? rows.map(pageItem).join('') : '<div class="muted">Không có trang khớp.</div>');
    bindItems($('wres'));
  };
  $('wq').oninput = () => { WB.q = $('wq').value; clearTimeout(vWeb.h); vWeb.h = setTimeout(draw, 150); };
  document.querySelectorAll('[data-st]').forEach(c => c.onclick = () => { WB.st = c.dataset.st; vWeb(); });
  document.querySelectorAll('[data-loai]').forEach(c => c.onclick = () => { WB.loai = c.dataset.loai; vWeb(); });
  draw();
}

/* ============ Câu hỏi / việc ============ */
let CHO = { chiChua: true };
function vCho() {
  const p = pending();
  const showQ = q => !CHO.chiChua || !(decision('CAU_HOI', q['Mã']) || q['Trả lời của anh']);
  const showC = r => !CHO.chiChua || !(decision('CHO_DUYET', r['Mã phân loại']) || r['Anh quyết']);
  const showM = r => !CHO.chiChua || !decision('CAN_MA', r['Mã phân loại']);
  const nhom = {}; D.CH.filter(showQ).forEach(q => (nhom[q['Nhóm'] || 'Khác'] = nhom[q['Nhóm'] || 'Khác'] || []).push(q));
  $('main').innerHTML = `
    <div class="card"><div class="row">
      <span class="chip ${CHO.chiChua ? 'on' : ''}" id="fChua">Chưa quyết (${p.all})</span><span class="chip ${CHO.chiChua ? '' : 'on'}" id="fAll">Tất cả</span>
      <span class="sp" style="flex:1"></span><button class="btn ghost" id="addQ">+ Thêm câu hỏi / việc</button></div>
      <div class="muted" style="margin-top:6px">Bấm lưu là ghi vào cơ sở dữ liệu (có giờ, người bấm, sửa lại được). Claude đọc khi làm đợt sau. Không tự đổi Shopee hay web Xfilter.vn.</div></div>
    <div class="card"><h2>Câu hỏi (${p.ch} chưa trả lời)</h2>
      ${Object.keys(nhom).length ? Object.keys(nhom).map(k => `<h3 style="margin-top:6px">${esc(k)}</h3>` + nhom[k].map(qCard).join('')).join('') : '<div class="muted">Không còn câu nào.</div>'}</div>
    <div class="card"><h2>Phân loại chờ duyệt (${p.cho} chưa quyết)</h2>
      <div class="muted" style="margin-bottom:8px">Có lên web không. Quyết định lưu trong app (cơ sở dữ liệu Master Listing), có bản sao ở tab QUYET_DINH của Google Sheet.</div>
      ${D.CHO.filter(showC).map(choCard).join('') || '<div class="muted">Không còn.</div>'}</div>
    <div class="card"><h2>Phân loại cần mã (${p.ma} chưa có)</h2>
      <div class="muted" style="margin-bottom:8px">Phân loại chưa có SKU dùng được. Anh gõ SKU đúng (hoặc "Bỏ" nếu tổ hợp không tồn tại).</div>
      ${D.CAN_MA.filter(showM).map(maCard).join('') || '<div class="muted">Không còn.</div>'}</div>`;
  $('fChua').onclick = () => { CHO.chiChua = true; vCho(); };
  $('fAll').onclick = () => { CHO.chiChua = false; vCho(); };
  $('addQ').onclick = addQuestion;
  $('main').querySelectorAll('[data-pick]').forEach(c => c.onclick = () => {
    const box = c.closest('.q'); box.querySelector('[name=qd]').value = c.dataset.pick;
    box.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x === c));
  });
  $('main').querySelectorAll('[data-save]').forEach(b => b.onclick = () => save(b));
  $('main').querySelectorAll('[data-list]').forEach(el => el.onclick = e => { e.preventDefault(); openListing(el.dataset.list); });
}
function chips(opts, cur) { return opts.map(o => `<span class="chip ${cur === o ? 'on' : ''}" data-pick="${esc(o)}">${esc(o)}</span>`).join(''); }
function done(d) { return d ? `<div class="muted">Đã lưu: <b>${esc(d.qd)}</b>${d.ghiChu ? ' — ' + esc(d.ghiChu) : ''} · ${esc(d.luc || '')}</div>` : ''; }
function qCard(q) {
  const d = decision('CAU_HOI', q['Mã']) || (q['Trả lời của anh'] ? { qd: q['Trả lời của anh'], ghiChu: q['Ghi chú của anh'], luc: q['Cập nhật lúc'] } : null);
  const opts = String(q['Gợi ý (cách nhau bằng |)'] || '').split('|').map(s => s.trim()).filter(Boolean);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CAU_HOI" data-khoa="${esc(q['Mã'])}" data-mota="${esc(q['Câu hỏi'])}">
    <div class="qt">${esc(q['Câu hỏi'])}</div>
    ${q['Bối cảnh'] ? `<div class="muted">${esc(q['Bối cảnh'])}</div>` : ''}${done(d)}
    <div class="act"><div>${chips(opts, d && d.qd)}</div>
      <input type="text" name="qd" placeholder="Trả lời (chọn gợi ý hoặc gõ)" value="${esc(d ? d.qd : '')}">
      <input type="text" name="gc" placeholder="Ghi chú (không bắt buộc)" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
function choCard(r) {
  const d = decision('CHO_DUYET', r['Mã phân loại']) || (r['Anh quyết'] ? { qd: r['Anh quyết'], ghiChu: r['Ghi chú của anh'] } : null);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CHO_DUYET" data-khoa="${esc(r['Mã phân loại'])}" data-mota="${esc(r['Tên phân loại'])}">
    <div class="qt">${esc(r['Tên phân loại'])} <span class="muted">· SKU ${esc(r['SKU gốc'])} · ${esc(r['Giá'])} · tồn ${esc(r['Tồn'])}</span></div>
    <div class="muted">${esc(r['Lý do'])}</div>
    <div class="muted"><a href="#" data-list="${esc(r['Shopee'])}">${esc(r['Listing Shopee']).slice(0, 90)}</a></div>${done(d)}
    <div class="act"><div>${chips(['Giữ lên web', 'Bỏ'], d && d.qd)}</div>
      <input type="hidden" name="qd" value="${esc(d ? d.qd : '')}">
      <input type="text" name="gc" placeholder="Ghi chú (ví dụ: mã đúng là …)" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
function maCard(r) {
  const d = decision('CAN_MA', r['Mã phân loại']);
  return `<div class="q ${d ? 'done' : 'todo'}" data-loai="CAN_MA" data-khoa="${esc(r['Mã phân loại'])}" data-mota="${esc(r['Tên phân loại'])}">
    <div class="qt">${esc(r['Dòng xe'])} ${esc(r['Đời xe'])} <span class="muted">· ${esc(r['Tên phân loại'])}</span></div>
    <div class="muted">SKU gốc: ${esc(r['SKU gốc'])} · ${esc(r['Giá'])} · tồn ${esc(r['Tồn'])} · <a href="#" data-list="${esc(r['Shopee'])}">${esc(r['Listing Shopee']).slice(0, 70)}</a></div>${done(d)}
    <div class="act"><div class="row"><input type="text" name="qd" placeholder="SKU đúng (vd ETO01) hoặc Bỏ" value="${esc(d ? d.qd : '')}" style="flex:1">
      <span class="chip" data-pick="Bỏ">Bỏ</span></div>
      <input type="text" name="gc" placeholder="Ghi chú" value="${esc(d ? d.ghiChu : '')}">
      <div><button class="btn" data-save>Lưu</button></div></div></div>`;
}
async function save(btn) {
  const box = btn.closest('.q');
  const d = { loai: box.dataset.loai, khoa: box.dataset.khoa, moTa: box.dataset.mota,
    qd: box.querySelector('[name=qd]').value.trim(), ghiChu: box.querySelector('[name=gc]').value.trim() };
  if (!d.qd) { toast('Chưa chọn / nhập quyết định.'); return; }
  btn.disabled = true; btn.textContent = 'Đang lưu…';
  try {
    const r = await call('luuQuyetDinh', TOKEN, d);
    D.qd[d.loai + '|' + d.khoa] = { qd: r.qd, ghiChu: r.ghiChu, luc: r.luc };
    toast('Đã lưu vào cơ sở dữ liệu Master Listing.');
    render();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Lưu'; }
}
function addQuestion() {
  openPanel('Thêm câu hỏi / việc cần nhớ', `<div class="card">
    <input id="nqNhom" type="text" placeholder="Nhóm (vd: Nội dung, Ảnh, Dữ liệu web)" style="width:100%;margin-bottom:8px">
    <textarea id="nqCau" placeholder="Câu hỏi / việc cần quyết"></textarea>
    <textarea id="nqBc" placeholder="Bối cảnh (không bắt buộc)" style="margin-top:8px"></textarea>
    <input id="nqGy" type="text" placeholder="Gợi ý trả lời, cách nhau bằng | (vd: Có|Không)" style="width:100%;margin:8px 0">
    <div class="err" id="nqErr"></div><button class="btn" id="nqBtn">Thêm</button></div>`);
  $('nqBtn').onclick = async () => {
    try {
      await call('themCauHoi', TOKEN, { nhom: $('nqNhom').value, cauHoi: $('nqCau').value, boiCanh: $('nqBc').value, goiY: $('nqGy').value });
      closePanel(); toast('Đã thêm.'); VIEW = 'cho'; start();
    } catch (e) { $('nqErr').textContent = e.message; }
  };
}

/* ============ Vào app ============ */
if (TOKEN) start(); else showLogin();
</script>
</body>
